openapi: 3.0.3
info:
  title: Karvon Scraper API
  version: 1.0.0
  description: |
    REST API for Karvon: the scraper module (Google Maps lead scraping with website
    email crawling) and the campaign module (outreach campaigns, contacts and their
    lifecycle, reusable email content, consent and the two delivery providers). Live
    job progress is delivered over Server-Sent Events.

    All routes except `/healthz`, `/openapi.json`, `/webhooks/*` and
    `/ai/chatgpt/callback` require `Authorization: Bearer <KARVON_API_KEY>`. The
    `/webhooks/*` routes carry no API key: they are called by Instantly and Mailchimp,
    and are authenticated instead by the per-registration token in their path together
    with the secret that provider signs its deliveries with. `/ai/chatgpt/callback` is
    where OpenAI returns the browser after Sign in with ChatGPT; it trusts only the
    single-use `state` minted by `POST /ai/chatgpt/connect`.
servers:
  - url: /api/v1
    description: Default mount point

security:
  - bearerAuth: []

tags:
  - name: system
  - name: stats
  - name: sources
  - name: scrape-categories
  - name: exclusions
  - name: jobs
  - name: businesses
  - name: verification
  - name: campaigns
  - name: contacts
  - name: content
  - name: ai
  - name: sending-accounts
  - name: newsletter
  - name: campaign-analytics
  - name: integrations
  - name: webhooks
  - name: domains
  - name: workspace
  - name: inbox
  - name: outreach

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe with dependency checks
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /openapi.json:
    get:
      tags: [system]
      operationId: getOpenapiSpec
      summary: This OpenAPI document as JSON (used by the frontend codegen)
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /stats/scraper:
    get:
      tags: [stats]
      operationId: getScraperStats
      summary: Dashboard counters and per-job email chart data
      responses:
        '200':
          description: Scraper statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScraperStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dashboard/report:
    get:
      tags: [stats]
      operationId: getDashboardReport
      summary: The client report — leads, verification, outreach and spend for a window
      description: |
        One call carries the whole cross-module dashboard: headline figures for the
        window, the same figures for the equal-length window before it (for deltas)
        and for all time, a bucketed series, the campaigns that sent in the window and
        where the leads came from.

        `from` and `to` are calendar dates in `tz`, both inclusive. With neither the
        window is the last 30 days ending today. `bucket` defaults by length: `day` up
        to 62 days, `week` up to 182, `month` beyond. A window may span 731 days at
        most, and a `day` series 400.

        Campaign figures are by send cohort, as in `/campaign-analytics`: an open,
        reply or bounce counts in the window of the send that drew it. Successful
        leads are counted when they happened. Verification spend is priced at the
        verifier's current per-1k rate.

        Campaigns started in Instantly's own app (`source: instantly`) send nothing
        through Karvon, so they are not in the `outreach` figures or the
        `sends`/`replied` series. They are reported beside them — `outreach.imported`,
        the `imported_*` series and their rows in `campaigns` — from Instantly's
        per-day campaign analytics, counted on the calendar day Instantly reports each
        figure on. `lead_cost` does count them: the spend pays for every campaign, so
        its emailed, replied and successful steps add theirs in, with Instantly's
        opportunities as successful leads (`lead_cost.imported_successful_leads`).

        `lead_cost` on each summary answers "what does one successful lead cost?":
        total spend over successful leads, with every funnel step priced and its
        arithmetic spelled out so the figure can be shown to a client with its working.
      parameters:
        - name: from
          in: query
          description: First day of the window, inclusive
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Last day of the window, inclusive
          schema: { type: string, format: date }
        - name: tz
          in: query
          description: IANA time zone the dates and buckets are read in
          schema: { type: string, default: UTC, example: Europe/London }
        - name: bucket
          in: query
          schema: { $ref: '#/components/schemas/DashboardBucket' }
      responses:
        '200':
          description: Dashboard report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: List configured providers
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sources/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [sources]
      operationId: getSource
      summary: Get a single provider
      responses:
        '200':
          description: Provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [sources]
      operationId: updateSource
      summary: Update provider key, cost and enabled flag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceUpdate' }
      responses:
        '200':
          description: Updated provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /sources/{id}/test:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [sources]
      operationId: testSource
      summary: Validate the stored API key with a single-result provider call
      responses:
        '200':
          description: Key works
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Provider rejected the key or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scrape-categories:
    get:
      tags: [scrape-categories]
      operationId: listScrapeCategories
      summary: List scrape categories, defaults first
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScrapeCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [scrape-categories]
      operationId: createScrapeCategory
      summary: Create a scrape category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScrapeCategoryCreate' }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScrapeCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /scrape-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [scrape-categories]
      operationId: getScrapeCategory
      summary: Get a single scrape category
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScrapeCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [scrape-categories]
      operationId: updateScrapeCategory
      summary: Rename a category or replace its terms; defaults are editable too
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScrapeCategoryUpdate' }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScrapeCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [scrape-categories]
      operationId: deleteScrapeCategory
      summary: Delete a user-created category (defaults return 409)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exclusions:
    get:
      tags: [exclusions]
      operationId: listExclusions
      summary: The global exclusion list, with how many records each rule covers
      parameters:
        - name: q
          in: query
          description: Case-insensitive match on the value as entered, the match key or the reason
          schema: { type: string, maxLength: 200 }
        - name: kind
          in: query
          description: Repeatable kind filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/ExclusionKind' }
          style: form
          explode: true
        - name: status
          in: query
          description: Active rules by default; removed rules are kept for audit
          schema:
            type: string
            enum: [active, removed, all]
            default: active
        - name: sort
          in: query
          schema:
            type: string
            default: created_at:desc
            enum: [created_at:desc, created_at:asc, value:asc, value:desc, kind:asc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated exclusions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalExclusionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [exclusions]
      operationId: createExclusion
      summary: Add a global exclusion
      description: |
        The rule applies at once to every existing and future record it matches.
        Nothing is deleted: matching live campaign leads are taken out of their
        campaigns (and removed from Instantly when they were already pushed) by a
        background sweep.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlobalExclusionCreate' }
      responses:
        '201':
          description: The new rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalExclusion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: An active rule with the same kind and match key already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /exclusions/preview:
    post:
      tags: [exclusions]
      operationId: previewExclusion
      summary: Normalise a prospective rule and show what it would cover, without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlobalExclusionCreate' }
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExclusionPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /exclusions/check:
    post:
      tags: [exclusions]
      operationId: checkExclusion
      summary: Is this business, address, domain or company globally excluded?
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExclusionCheckRequest' }
      responses:
        '200':
          description: The first matching rule, if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExclusionCheckResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /exclusions/bulk:
    post:
      tags: [exclusions]
      operationId: bulkCreateExclusions
      summary: Add many global exclusions at once
      description: |
        Each item is created independently, exactly as POST /exclusions would create
        it, so a duplicate or invalid item does not hold back the rest. The response
        lists one result per item, in request order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExclusionBulkCreate' }
      responses:
        '200':
          description: One result per item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExclusionBulkResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /exclusions/brand-scan:
    get:
      tags: [exclusions]
      operationId: scanBrands
      summary: Find chains and franchises in the stored businesses
      description: |
        Groups every stored business by registrable website domain (`domain`), by
        normalised name (`name`) or by the first two words of the normalised name
        (`name_prefix`), and lists the groups with at least `min_locations`
        listings. Nothing is excluded: each group carries `suggested_rule`, which
        can be sent as is to POST /exclusions/preview, /exclusions or
        /exclusions/bulk.

        The domain grouping skips shared platforms (social networks, website
        builders, booking sites, free mail), where many unrelated businesses share
        one domain. Groups whose every location is already excluded, and dismissed
        groups, are hidden unless asked for.
      parameters:
        - name: group_by
          in: query
          schema: { $ref: '#/components/schemas/BrandScanGroupBy' }
        - name: min_locations
          in: query
          description: Fewest listings a group needs
          schema: { type: integer, minimum: 2, maximum: 100000, default: 3 }
        - name: min_cities
          in: query
          description: Fewest distinct cities (city and state) a group needs
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: min_states
          in: query
          description: Fewest distinct states a group needs
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - name: q
          in: query
          description: Case-insensitive match on the group key or its most common name
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          description: Repeatable; only businesses whose category equals one of the values are grouped
          schema:
            type: array
            maxItems: 50
            items: { type: string, maxLength: 200 }
          style: form
          explode: true
        - name: state
          in: query
          description: Repeatable; only businesses in one of these states are grouped
          schema:
            type: array
            maxItems: 60
            items: { type: string, maxLength: 100 }
          style: form
          explode: true
        - name: include_excluded
          in: query
          description: Also list groups whose every location is already excluded
          schema: { type: boolean, default: false }
        - name: include_dismissed
          in: query
          description: Also list dismissed groups
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema:
            type: string
            default: locations:desc
            enum: [locations:desc, cities:desc, states:desc, reviews:desc, names:desc, key:asc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Candidate brands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandCandidateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /exclusions/brand-scan/dismissals:
    get:
      tags: [exclusions]
      operationId: listBrandScanDismissals
      summary: Groups dismissed from the brand scan, newest first
      parameters:
        - name: group_by
          in: query
          schema: { $ref: '#/components/schemas/BrandScanGroupBy' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Dismissals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandScanDismissalList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [exclusions]
      operationId: dismissBrandScanGroup
      summary: Hide a group from later scans, e.g. a small business with a few locations
      description: |
        Keyed by grouping and group key, so dismissing the `name` group
        "joes pizza" does not hide the `domain` group joespizza.com. Excludes
        nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandScanDismissalCreate' }
      responses:
        '201':
          description: The dismissal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandScanDismissal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The group is already dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /exclusions/brand-scan/dismissals/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [exclusions]
      operationId: undismissBrandScanGroup
      summary: Put a dismissed group back into the scan
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exclusions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [exclusions]
      operationId: getExclusion
      summary: One exclusion rule
      responses:
        '200':
          description: Exclusion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalExclusion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [exclusions]
      operationId: removeExclusion
      summary: Remove an exclusion
      description: |
        The rule is kept as history and stops applying at once. Campaign leads it
        took out that never reached Instantly go back to pending unless another rule
        still covers them; leads that were already pushed stay excluded.
      parameters:
        - name: note
          in: query
          schema: { type: string, maxLength: 1000 }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The rule was already removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /jobs/estimate:
    post:
      tags: [jobs]
      operationId: estimateJob
      summary: Estimate query count and provider cost for a config
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEstimate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Job history
      parameters:
        - name: status
          in: query
          description: Repeatable status filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/JobStatus' }
          style: form
          explode: true
        - name: source_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Only jobs created at or after this instant
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only jobs created at or before this instant
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: Case-insensitive match on job name
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          description: Sort field and direction
          schema:
            type: string
            default: created_at:desc
            enum: [created_at:desc, created_at:asc, name:asc, name:desc, status:asc, status:desc, started_at:desc, started_at:asc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [jobs]
      operationId: createJob
      summary: Create and enqueue a scrape job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
      responses:
        '201':
          description: Created job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [jobs]
      operationId: getJob
      summary: Job detail including stats
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [jobs]
      operationId: deleteJob
      summary: Delete a job with its queries, events and result links
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cooperatively cancel a queued or running job
      responses:
        '200':
          description: Cancelled job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{id}/rerun:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [jobs]
      operationId: rerunJob
      summary: Clone a job's config into a new queued job
      responses:
        '201':
          description: New job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /jobs/{id}/recrawl:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [jobs]
      operationId: recrawlJob
      summary: Re-crawl a finished job's websites without a new provider search
      description: |
        Creates a new job that owns the same businesses as the source job and enters
        the pipeline at the crawl stage. No Google Maps query is sent to the provider
        and nothing is billed. A business is revisited when it lacks any of the
        requested targets (emails by default); the rest are skipped. Every revisited
        website is fetched fresh, never reused from an earlier crawl. The source job
        must have finished.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecrawlJobRequest' }
      responses:
        '201':
          description: New re-crawl job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The job is still running, or has no businesses to re-crawl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /jobs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: Server-Sent Events stream of job progress, logs and status
      description: |
        `text/event-stream`. Event names are `progress`, `log` and `status`; every event
        carries a monotonic `id`. Reconnect with the `Last-Event-ID` header (or `?after=`)
        to replay missed events. A `: ping` comment is sent every 15 seconds. The stream
        closes once the job reaches a terminal status.
      parameters:
        - name: after
          in: query
          description: Replay events with an id greater than this value
          schema: { type: integer, format: int64, minimum: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/export.csv:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [jobs]
      operationId: exportJobCsv
      summary: Stream this job's businesses and emails as CSV
      responses:
        '200':
          description: CSV attachment
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /businesses:
    get:
      tags: [businesses]
      operationId: listBusinesses
      summary: Master business list
      parameters:
        - name: job_id
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          description: Repeatable; matches a business whose category equals any of the values
          schema:
            type: array
            maxItems: 50
            items: { type: string, maxLength: 200 }
          style: form
          explode: true
        - name: state
          in: query
          schema: { type: string, maxLength: 100 }
        - name: city
          in: query
          schema: { type: string, maxLength: 200 }
        - name: has_email
          in: query
          schema: { type: boolean }
        - name: suppressed
          in: query
          description: Defaults to false; pass true for only suppressed rows
          schema: { type: boolean }
        - name: excluded
          in: query
          description: Absent lists every row; false hides globally excluded businesses, true lists only them
          schema: { type: boolean }
        - name: q
          in: query
          description: Trigram search over name and domain
          schema: { type: string, maxLength: 200 }
        - name: email_source
          in: query
          schema: { $ref: '#/components/schemas/EmailSource' }
        - name: verification_tag
          in: query
          description: Repeatable filter on the tag of the business's primary address
          schema:
            type: array
            items: { $ref: '#/components/schemas/VerificationTag' }
          style: form
          explode: true
        - name: sort
          in: query
          schema:
            type: string
            default: created_at:desc
            enum: [created_at:desc, created_at:asc, name:asc, name:desc, city:asc, city:desc, state:asc, state:desc, rating:desc, rating:asc, reviews:desc, reviews:asc, verification_score:desc, verification_score:asc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated businesses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /businesses/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [businesses]
      operationId: getBusiness
      summary: Business detail with every known email
      responses:
        '200':
          description: Business
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [businesses]
      operationId: updateBusiness
      summary: Update suppression flag or notes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessUpdate' }
      responses:
        '200':
          description: Updated business
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /businesses/bulk:
    post:
      tags: [businesses]
      operationId: bulkUpdateBusinesses
      summary: Suppress or unsuppress many businesses at once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessBulkRequest' }
      responses:
        '200':
          description: Number of rows changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /businesses/recrawl:
    post:
      tags: [businesses]
      operationId: recrawlBusinesses
      summary: Re-crawl selected or filtered businesses for emails and/or social profiles
      description: |
        Creates a re-crawl job for exactly `ids`, or for every business matching the
        filters when `ids` is absent. No provider search runs and nothing is billed. A
        business is revisited when it lacks any of `targets`, and its website is
        fetched fresh. At most 20000 businesses per request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessRecrawlRequest' }
      responses:
        '201':
          description: New re-crawl job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: No business matches, or no Google Maps source exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /businesses/social-scrape:
    post:
      tags: [businesses]
      operationId: socialScrapeBusinesses
      summary: Read the social profiles of selected or filtered businesses for emails and phone numbers
      description: |
        Creates a social media scrape job for exactly `ids`, or for every business
        matching the filters when `ids` is absent. Each business with a profile on one
        of `networks` (found by the website crawl) has that public page read: the
        email address it shows is added to the business with source "facebook", and
        its phone number too when the business has none. Businesses without such a
        profile are skipped. No provider search runs and nothing is billed. At most
        20000 businesses per request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessSocialScrapeRequest' }
      responses:
        '201':
          description: New social media scrape job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: No business matches, the network's scraper is not enabled, or no Google Maps source exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /businesses/export:
    post:
      tags: [businesses]
      operationId: exportBusinesses
      summary: Stream a filtered business set as CSV
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessExportRequest' }
      responses:
        '200':
          description: CSV attachment
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /verification/stats:
    get:
      tags: [verification]
      operationId: getVerificationStats
      summary: Tag distribution, pass coverage, credits and the current cost to verify
      responses:
        '200':
          description: Verification statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /verification/settings:
    get:
      tags: [verification]
      operationId: getVerificationSettings
      summary: Provider weights, toggles, the paid band and live provider health
      responses:
        '200':
          description: The current verification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSettingsView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [verification]
      operationId: updateVerificationSettings
      summary: Replace the verification settings
      description: |
        The weights of every weighted provider must total 100%, whether or not each
        provider is enabled; a disabled or unreachable provider has its weight
        redistributed at scoring time rather than requiring the operator to
        re-balance. `paid_min_score` must not exceed `paid_threshold`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationSettingsUpdate' }
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSettingsView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /verification/emails:
    get:
      tags: [verification]
      operationId: listVerifications
      summary: Every address that has been through, or is queued for, verification
      parameters:
        - name: tag
          in: query
          description: Repeatable tag filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/VerificationTag' }
          style: form
          explode: true
        - name: min_score
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: max_score
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: pass2_status
          in: query
          schema: { $ref: '#/components/schemas/Pass2Status' }
        - name: needs_third_party
          in: query
          description: |
            Only addresses that passed the local gate, fall inside the paid band and
            have never been sent to a third-party verifier. An address is sent to one
            at most once, ever, so this set only ever shrinks.
          schema: { type: boolean }
        - name: has_typo
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Trigram search over the address
          schema: { type: string, maxLength: 200 }
        - name: business_id
          in: query
          schema: { type: string, format: uuid }
        - name: job_id
          in: query
          schema: { type: string, format: uuid }
        - name: include_suppressed
          in: query
          description: Defaults to false, which hides addresses held only by suppressed businesses
          schema: { type: boolean }
        - name: excluded
          in: query
          description: Absent lists every row; false hides globally excluded addresses, true lists only them
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            default: final_score:desc
            enum: [final_score:desc, final_score:asc, email:asc, email:desc,
                   pass1_verified_at:desc, pass1_verified_at:asc,
                   pass2_verified_at:desc, pass2_verified_at:asc,
                   third_party_sent_at:desc, third_party_sent_at:asc,
                   updated_at:desc, updated_at:asc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated verifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /verification/emails/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [verification]
      operationId: getVerification
      summary: One address with its full Pass 1 breakdown and raw provider payload
      responses:
        '200':
          description: Verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /verification/emails/{id}/self:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [verification]
      operationId: verifyEmailSelf
      summary: Queue the free local pass for one address
      responses:
        '202':
          description: The run that will score this address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /verification/emails/{id}/third-party:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [verification]
      operationId: verifyEmailThirdParty
      summary: Queue the paid provider check for one address
      description: |
        Refused with 409 when the address has already been sent to a third-party
        verifier, has not completed the local pass, scored below the gate, or scored
        at or above the confidence threshold. The first of those is permanent: an
        address is sent to a third party at most once, ever, and no setting, score or
        retry lifts that. In every case nothing would be billed, so the request is
        rejected rather than silently skipped.
      responses:
        '202':
          description: The run that will verify this address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /verification/emails/{id}/apply-typo:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [verification]
      operationId: applyTypoSuggestion
      summary: Rewrite every business holding the misspelled address to the suggested one
      description: |
        A business that already holds the corrected address keeps it and loses the
        misspelled row. Primary addresses are re-picked afterwards and the corrected
        address is queued for local verification. The response is the corrected
        address's verification row.
      responses:
        '200':
          description: The corrected address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /verification/runs/estimate:
    post:
      tags: [verification]
      operationId: estimateVerificationRun
      summary: How many addresses a run would process, and what it would cost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationRunEstimateRequest' }
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRunEstimate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /verification/runs:
    get:
      tags: [verification]
      operationId: listVerificationRuns
      summary: Run history
      parameters:
        - name: pass
          in: query
          schema: { $ref: '#/components/schemas/VerificationPass' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [verification]
      operationId: createVerificationRun
      summary: Start a bulk verification run
      description: |
        A `third_party` run must carry `max_cost_cents`: the server re-estimates and
        refuses with 409 if the cost has grown past what was approved, so a run can
        never spend more than the figure the operator confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationRunCreate' }
      responses:
        '201':
          description: Created run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /verification/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [verification]
      operationId: getVerificationRun
      summary: Run progress, polled while a run is active
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /verification/runs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [verification]
      operationId: cancelVerificationRun
      summary: Cooperatively cancel a queued or running verification run
      responses:
        '200':
          description: Cancelled run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /integrations:
    get:
      tags: [integrations]
      operationId: getIntegrations
      summary: State of every outreach integration, its webhook and its event log
      responses:
        '200':
          description: Integration status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integrations' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/instantly/test:
    post:
      tags: [integrations]
      operationId: testInstantlyConnection
      summary: Validate the stored Instantly key with a single API call
      responses:
        '200':
          description: The key works
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Instantly rejected the key or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /integrations/instantly/webhook:
    post:
      tags: [integrations]
      operationId: registerInstantlyWebhook
      summary: Register (or rotate) the Instantly webhook that feeds the event log
      description: |
        Without `rotate` an already registered webhook is left alone and returned as
        it stands. With `rotate` the token and signing secret are replaced, which
        invalidates the previous URL immediately.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookRegisterRequest' }
      responses:
        '200':
          description: The registered webhook
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Instantly refused the registration or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [integrations]
      operationId: deleteInstantlyWebhook
      summary: Remove the Instantly webhook registration
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/mailchimp/test:
    post:
      tags: [integrations]
      operationId: testMailchimpConnection
      summary: Validate the stored Mailchimp key with a single API call
      responses:
        '200':
          description: The key works
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Mailchimp rejected the key or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /integrations/events:
    get:
      tags: [integrations]
      operationId: listProviderEvents
      summary: The raw provider event log, newest first
      parameters:
        - name: provider
          in: query
          schema: { $ref: '#/components/schemas/ProviderName' }
        - name: processed
          in: query
          schema: { type: boolean }
        - name: has_error
          in: query
          schema: { type: boolean }
        - name: contact_id
          in: query
          schema: { type: string, format: uuid }
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated provider events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /integrations/events/{id}/reprocess:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [integrations]
      operationId: reprocessProviderEvent
      summary: Replay one stored provider event through the ingest pipeline
      responses:
        '202':
          description: The event, queued for reprocessing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /integrations/sync-runs:
    get:
      tags: [integrations]
      operationId: listSyncRuns
      summary: History of the reconciliation runs against both providers
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/SyncRunKind' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated sync runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncRunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /integrations/instantly/cleanup:
    get:
      tags: [integrations]
      operationId: getInstantlyCleanup
      summary: Instantly contact capacity, the saved cleanup policy, and the latest runs
      description: |
        Instantly's plans cap "uploaded contacts": every lead sitting in a campaign,
        whatever its status, counts until it is deleted from the campaign. A cleanup
        deletes the leads Instantly has finished with, which frees their slots, while
        Karvon keeps each lead, its sends and its timeline (`provider_removed_at` on
        the lead, a `removed_from_provider` event on the contact).

        Only campaigns launched from Karvon are cleaned: a campaign started in
        Instantly has no local copy of its leads, so deleting them would lose the
        record. Its leads are still counted in the capacity estimate.
      responses:
        '200':
          description: Cleanup overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantlyCleanupOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/instantly/cleanup/settings:
    put:
      tags: [integrations]
      operationId: updateInstantlyCleanupSettings
      summary: Save the cleanup policy, the automatic switch and the plan's contact cap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstantlyCleanupSettings' }
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantlyCleanupSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /integrations/instantly/cleanup/preview:
    get:
      tags: [integrations]
      operationId: previewInstantlyCleanup
      summary: How many leads a cleanup would delete, per campaign, without deleting any
      parameters:
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/InstantlyCleanupScope' }
        - name: min_idle_days
          in: query
          description: Defaults to 3
          schema: { type: integer, minimum: 0, maximum: 90 }
        - name: include_replied
          in: query
          description: Defaults to false
          schema: { type: boolean }
        - name: campaign_id
          in: query
          description: Repeatable; empty means every Karvon campaign
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
        - name: max_leads
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantlyCleanupPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /integrations/instantly/cleanup/runs:
    get:
      tags: [integrations]
      operationId: listInstantlyCleanupRuns
      summary: Cleanup runs, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated cleanup runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantlyCleanupRunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [integrations]
      operationId: startInstantlyCleanup
      summary: Start a cleanup run that deletes finished leads from Instantly
      description: |
        Runs in the background, in batches; poll the run for progress. Only one run
        can be queued or running at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstantlyCleanupRequest' }
      responses:
        '202':
          description: The run, queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantlyCleanupRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Nothing matches, or a run is already in flight
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Instantly is not configured or refused the key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /integrations/instantly/cleanup/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [integrations]
      operationId: getInstantlyCleanupRun
      summary: One cleanup run, with its progress
      responses:
        '200':
          description: Cleanup run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantlyCleanupRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/instantly/{token}:
    parameters:
      - $ref: '#/components/parameters/WebhookTokenPath'
    post:
      tags: [webhooks]
      operationId: receiveInstantlyWebhook
      summary: Instantly event delivery endpoint
      description: |
        Not an API-key route. The path token identifies the registration and the
        request is additionally authenticated by the signature Instantly computes
        with the shared secret; both must match or the delivery is rejected with 401.
        The body is stored verbatim and processed asynchronously, so a duplicate
        delivery is acknowledged rather than applied twice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Delivery accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '401':
          description: Bad signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /webhooks/mailchimp/{token}:
    parameters:
      - $ref: '#/components/parameters/WebhookTokenPath'
    get:
      tags: [webhooks]
      operationId: verifyMailchimpWebhook
      summary: Mailchimp's reachability probe, which must answer 200 with no body
      security: []
      responses:
        '200': { description: Endpoint reachable }
        '404':
          description: Unknown token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [webhooks]
      operationId: receiveMailchimpWebhook
      summary: Mailchimp event delivery endpoint
      description: |
        Not an API-key route. Mailchimp posts form-encoded fields to a URL whose path
        token identifies the audience; the token is the shared secret, so an unknown
        one is a 404 and a malformed delivery a 401.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Delivery accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '401':
          description: Delivery could not be authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: Campaign list with the counters the dashboard shows
      parameters:
        - name: status
          in: query
          description: Repeatable status filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/CampaignStatus' }
          style: form
          explode: true
        - name: source
          in: query
          description: Repeatable filter on where the campaign was started
          schema:
            type: array
            items: { $ref: '#/components/schemas/CampaignSource' }
          style: form
          explode: true
        - name: q
          in: query
          description: Case-insensitive match on campaign name
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          schema:
            type: string
            default: created_at:desc
            enum: [created_at:desc, created_at:asc, name:asc, name:desc,
                   launched_at:desc, launched_at:asc, leads_total:desc, leads_total:asc,
                   updated_at:desc, updated_at:asc]
        - name: include_archived
          in: query
          description: Defaults to false, which hides archived campaigns unless `status` asks for them
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated campaigns
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: Create a draft campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignCreate' }
      responses:
        '201':
          description: Created campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaigns/sync:
    post:
      tags: [campaigns]
      operationId: syncCampaigns
      summary: Queue a sync of every campaign with Instantly now
      description: |
        Imports the campaigns started in Instantly's own app (as `source: instantly`),
        refreshes the ones imported before, then reconciles every live campaign.
        The same pass runs periodically on its own.
      responses:
        '202': { description: Sync queued }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /campaigns/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: Campaign with its sending accounts, variants, counts and launch checklist
      responses:
        '200':
          description: Campaign detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [campaigns]
      operationId: updateCampaign
      summary: Update a campaign's name, brief, schedule, settings or steps
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignUpdate' }
      responses:
        '200':
          description: Updated campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [campaigns]
      operationId: archiveCampaign
      summary: Archive a campaign
      description: |
        Campaigns are never deleted: the send history, the events and the consent
        trail behind them have to survive. The campaign is moved to `archived` and
        disappears from the default list.
      responses:
        '200':
          description: Archived campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /campaigns/{id}/checklist:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [campaigns]
      operationId: getCampaignChecklist
      summary: What still stands between this campaign and a launch
      responses:
        '200':
          description: Checklist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignChecklist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /campaigns/{id}/launch:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [campaigns]
      operationId: launchCampaign
      summary: Create the campaign at Instantly and push its leads, now or at a scheduled time
      description: |
        The pre-launch checklist is re-evaluated server-side; a blocking item refuses
        the launch with 409 and the failing items in `error.details`, so the client
        never has to guess which one it was. The push itself runs in the background.

        Every launch first frees Instantly contact slots: Karvon leads Instantly has
        finished with (the cleanup "finished" scope, with the saved idle window and
        replied setting) and every lead of a campaign started in Instantly that has
        completed are deleted there. Nothing in a running campaign is touched.

        With `scheduled_at` the campaign moves to `scheduled` and is prepared at
        Instantly straight away: slots freed, the campaign created (not started),
        its leads pushed. At that moment the checklist is evaluated again (the
        campaign can still be edited while it waits; a failing gate ends in `failed`
        with the reasons in `error`), leads added since are pushed and the campaign
        is activated. Instantly still only sends inside the campaign's sending
        window, so a time outside it starts at the next window.

        A `scheduled` campaign can be launched again: a new `scheduled_at`
        reschedules it, no body (or a null `scheduled_at`) launches it now.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaunchRequest' }
      responses:
        '202':
          description: The campaign, now `launching` or `scheduled`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A blocking checklist item failed, or the campaign is already launched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Instantly refused the campaign or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /campaigns/{id}/unschedule:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [campaigns]
      operationId: unscheduleCampaign
      summary: Cancel a scheduled launch; the campaign goes back to draft
      responses:
        '200':
          description: The campaign, back in draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /campaigns/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [campaigns]
      operationId: pauseCampaign
      summary: Pause sending at Instantly
      responses:
        '200':
          description: Paused campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: Instantly refused the change or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /campaigns/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [campaigns]
      operationId: resumeCampaign
      summary: Resume a paused campaign
      responses:
        '200':
          description: Resumed campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: Instantly refused the change or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /campaigns/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [campaigns]
      operationId: syncCampaign
      summary: Queue a reconciliation of this campaign against Instantly
      responses:
        '202': { description: Reconciliation queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /campaigns/{id}/sending-accounts:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [campaigns]
      operationId: setCampaignSendingAccounts
      summary: Replace the set of mailboxes this campaign sends from
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignSendingAccountsRequest' }
      responses:
        '200':
          description: The campaign's sending accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SendingAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaigns/{id}/variants:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [campaigns]
      operationId: listCampaignVariants
      summary: The variants attached to this campaign with their per-step weights
      responses:
        '200':
          description: Campaign variants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CampaignVariant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [campaigns]
      operationId: setCampaignVariants
      summary: Replace the variant mix, which bumps the campaign's weights version
      description: |
        Assignments already locked to a contact keep the variant they were given, so
        a re-weighting only affects leads that have not been assigned yet. Weights are
        optional relative shares between 0 and 100; when none on a step is positive its
        variants are split evenly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignVariantsRequest' }
      responses:
        '200':
          description: The campaign's variants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CampaignVariant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaigns/{id}/leads:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [campaigns]
      operationId: listCampaignLeads
      summary: The campaign's leads joined with their contacts
      parameters:
        - name: status
          in: query
          description: Repeatable lead status filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/CampaignLeadStatus' }
          style: form
          explode: true
        - name: stage
          in: query
          description: Repeatable filter on the contact's lifecycle stage
          schema:
            type: array
            items: { $ref: '#/components/schemas/ContactStage' }
          style: form
          explode: true
        - name: q
          in: query
          description: Case-insensitive match on email, company or name
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          schema:
            type: string
            default: created_at:desc
            enum: [created_at:desc, created_at:asc, email:asc, email:desc,
                   last_contacted_at:desc, last_contacted_at:asc,
                   last_replied_at:desc, status:asc, stage:asc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated campaign leads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignLeadList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaigns/{id}/leads/import:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [campaigns]
      operationId: importCampaignLeads
      summary: Turn scraped businesses into contacts and attach them as leads
      description: |
        Suppressed contacts, addresses that fail validation and contacts already on
        this campaign are skipped rather than refused, and counted separately in the
        result so the operator can see what the filter really brought in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadImportRequest' }
      responses:
        '200':
          description: What the import did
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaigns/{id}/leads/import/estimate:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [campaigns]
      operationId: estimateCampaignLeadImport
      summary: What the same import would do, without doing it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadImportRequest' }
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaigns/{id}/leads/{leadId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/LeadIdPath'
    get:
      tags: [campaigns]
      operationId: getCampaignLead
      summary: One lead with its contact, variant assignments, sends and events
      responses:
        '200':
          description: Lead detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignLeadDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [campaigns]
      operationId: deleteCampaignLead
      summary: Remove a lead from the campaign
      description: |
        Only a lead that has not been contacted can be removed; once a send exists the
        lead is history and is skipped instead.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /campaigns/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [campaigns]
      operationId: listCampaignActivity
      summary: This campaign's slice of the contact event log
      parameters:
        - name: type
          in: query
          description: Repeatable event type filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/ContactEventType' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /inbox:
    get:
      tags: [inbox]
      operationId: listInbox
      summary: Received emails mirrored from Instantly's Unibox
      description: |
        The inbox sync mirrors every received email; a reply webhook queues a sync
        at once, and a periodic pass catches anything a webhook missed. By default
        one row per conversation (its newest reply) and no auto-replies, like the
        Unibox's primary view.
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - name: account
          in: query
          description: Repeatable filter on the mailbox that received the email
          schema:
            type: array
            maxItems: 200
            items: { type: string, maxLength: 320 }
          style: form
          explode: true
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Case-insensitive match on sender, subject, preview or company
          schema: { type: string, maxLength: 200 }
        - name: latest_of_thread
          in: query
          schema: { type: boolean, default: true }
        - name: include_auto_replies
          in: query
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema:
            type: string
            default: sent_at:desc
            enum: [sent_at:desc, sent_at:asc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated received emails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxEmailList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /inbox/sync:
    post:
      tags: [inbox]
      operationId: syncInbox
      summary: Queue an inbox sync now
      responses:
        '202': { description: Sync queued }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /inbox/threads/{threadId}:
    parameters:
      - $ref: '#/components/parameters/ThreadIdPath'
    get:
      tags: [inbox]
      operationId: getInboxThread
      summary: One conversation, both sides, oldest email first
      description: |
        The first time a thread is opened its sent side is fetched from Instantly;
        `refresh` asks again. When Instantly cannot be reached the stored emails
        are returned with `stale` set.
      parameters:
        - name: refresh
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxThread' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inbox/threads/{threadId}/read:
    parameters:
      - $ref: '#/components/parameters/ThreadIdPath'
    post:
      tags: [inbox]
      operationId: markInboxThreadRead
      summary: Mark a conversation read, at Instantly and here
      responses:
        '204': { description: Marked read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /outreach/leads:
    get:
      tags: [outreach]
      operationId: listOutreachLeads
      summary: Everyone outreach has emailed, with how they answered
      description: |
        One row per campaign lead. `outcome` folds the interest status set in the
        Unibox and the lead's delivery state into one word: successful (meeting
        booked, meeting completed, won), potential (interested, no-show), bad (not
        interested, wrong person, lost, unsubscribed), replied (an answer nobody
        has labelled, or an out-of-office), no_reply, bounced, not_contacted.
      parameters:
        - $ref: '#/components/parameters/OutreachOutcomeFilter'
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Case-insensitive match on email, name, company or campaign
          schema: { type: string, maxLength: 200 }
        - name: include_not_contacted
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/OutreachSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated outreach outcomes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutreachLeadList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /outreach/leads/export.csv:
    get:
      tags: [outreach]
      operationId: exportOutreachLeads
      summary: Stream the outreach outcomes table as CSV
      parameters:
        - $ref: '#/components/parameters/OutreachOutcomeFilter'
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: include_not_contacted
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/OutreachSort'
      responses:
        '200':
          description: CSV attachment
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      summary: The contact master list
      parameters:
        - name: stage
          in: query
          description: Repeatable lifecycle stage filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/ContactStage' }
          style: form
          explode: true
        - name: suppressed
          in: query
          schema: { type: boolean }
        - name: has_consent
          in: query
          description: Whether the contact holds an un-revoked consent record
          schema: { type: boolean }
        - name: excluded
          in: query
          description: Absent lists every row; false hides globally excluded contacts, true lists only them
          schema: { type: boolean }
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Case-insensitive match on email, company or name
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          schema:
            type: string
            default: created_at:desc
            enum: [created_at:desc, created_at:asc, email:asc, email:desc,
                   stage_changed_at:desc, last_event_at:desc, stage:asc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [contacts]
      operationId: getContact
      summary: One contact with its campaigns, consents, suppressions and subscriptions
      responses:
        '200':
          description: Contact detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [contacts]
      operationId: updateContact
      summary: Update the contact's profile fields
      description: |
        The email address is not editable: it is the identity the provider, the
        consent record and the event log all hang off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contacts/{id}/timeline:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [contacts]
      operationId: getContactTimeline
      summary: Everything that has happened to this contact, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contacts/{id}/permission-request:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [contacts]
      operationId: requestContactPermission
      summary: Record that newsletter permission was asked for
      description: |
        This only moves the contact to `permission_requested` and writes the event. It
        grants nothing: the newsletter gate still needs a consent record, captured
        separately once the contact actually answers.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionRequest' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contacts/{id}/consents:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [contacts]
      operationId: createContactConsent
      summary: Capture the permission that lets this contact be pushed to the newsletter
      description: |
        `evidence` is the record of what was actually said — the quoted reply, the form
        payload, the note from the call — and `captured_by` the operator answering for
        it. Both are mandatory: a consent record without them cannot be defended later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentCreate' }
      responses:
        '201':
          description: The captured consent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contacts/{id}/consents/{consentId}/revoke:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/ConsentIdPath'
    post:
      tags: [contacts]
      operationId: revokeContactConsent
      summary: Withdraw a consent record
      description: |
        The record is kept and stamped with the revocation rather than deleted, so the
        audit trail still shows that permission once existed and when it ended.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRevokeRequest' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contacts/{id}/suppress:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [contacts]
      operationId: suppressContact
      summary: Stop contacting this person
      description: |
        Only the reversible reasons can be applied by hand. `unsubscribed`, `bounced`
        and `invalid_email` are permanent and are written by the provider webhooks, not
        by an operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressRequest' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /contacts/{id}/suppressions/{suppressionId}/lift:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/SuppressionIdPath'
    post:
      tags: [contacts]
      operationId: liftContactSuppression
      summary: Lift a reversible suppression
      description: |
        Refused with 409 when the suppression is a permanent one: an unsubscribe, a
        hard bounce or an invalid address can never be lifted, whoever asks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionLiftRequest' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /content/components:
    get:
      tags: [content]
      operationId: listEmailComponents
      summary: The reusable building blocks an email is assembled from
      parameters:
        - name: type
          in: query
          description: Repeatable component type filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/ComponentType' }
          style: form
          explode: true
        - name: status
          in: query
          description: Repeatable status filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/ContentStatus' }
          style: form
          explode: true
        - name: tag
          in: query
          schema: { type: string, maxLength: 60 }
        - name: q
          in: query
          description: Case-insensitive match on name and body
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated components
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailComponentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [content]
      operationId: createEmailComponent
      summary: Write a new component
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentCreate' }
      responses:
        '201':
          description: Created component
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailComponent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /content/components/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [content]
      operationId: getEmailComponent
      summary: One component
      responses:
        '200':
          description: Component
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailComponent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [content]
      operationId: updateEmailComponent
      summary: Edit a component's text, name, tags or language
      description: |
        A component in use by a locked assignment cannot have its body changed: the
        email that went out has to keep meaning what it said. Archive it and write a
        new one instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentUpdate' }
      responses:
        '200':
          description: Updated component
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailComponent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /content/components/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [content]
      operationId: setEmailComponentStatus
      summary: Move a component through the review flow
      description: |
        draft → reviewed → approved → active, with AI output entering at
        `ai_generated`. Anything can be archived or sent back to draft; every other
        jump is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentStatusRequest' }
      responses:
        '200':
          description: Updated component
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailComponent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /content/components/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [content]
      operationId: getEmailComponentUsage
      summary: Which variants, campaigns and locked assignments depend on this component
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /content/variants:
    get:
      tags: [content]
      operationId: listEmailVariants
      summary: The assembled email variants
      parameters:
        - name: status
          in: query
          description: Repeatable status filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/ContentStatus' }
          style: form
          explode: true
        - name: step
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: q
          in: query
          description: Case-insensitive match on variant name
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVariantList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [content]
      operationId: createEmailVariant
      summary: Assemble components into a variant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantCreate' }
      responses:
        '201':
          description: Created variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVariantDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /content/variants/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [content]
      operationId: getEmailVariant
      summary: One variant with its slots and the campaigns using it
      responses:
        '200':
          description: Variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVariantDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [content]
      operationId: updateEmailVariant
      summary: Rename a variant, move its step or re-pick its components
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantUpdate' }
      responses:
        '200':
          description: Updated variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVariantDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /content/variants/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [content]
      operationId: setEmailVariantStatus
      summary: Move a variant through the review flow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentStatusRequest' }
      responses:
        '200':
          description: Updated variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVariantDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /content/variants/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [content]
      operationId: previewEmailVariant
      summary: Render a variant, optionally against a real contact
      description: |
        Without `contact_id` the placeholders are filled with sample values and listed
        in `placeholders`, so the operator can see exactly which merge fields a live
        send would need.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantPreviewRequest' }
      responses:
        '200':
          description: Rendered email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /content/preview:
    post:
      tags: [content]
      operationId: previewEmailComponents
      summary: Render an ad-hoc set of component slots without saving a variant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentPreviewRequest' }
      responses:
        '200':
          description: Rendered email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /ai/provider:
    get:
      tags: [ai]
      operationId: getAiProvider
      summary: Which AI provider is configured and whether it generates or is pasted into
      responses:
        '200':
          description: Provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ai/chatgpt/connect:
    post:
      tags: [ai]
      operationId: connectChatGPT
      summary: Start Sign in with ChatGPT
      description: |
        Records a sign-in attempt (valid for 10 minutes) and returns the OpenAI URL to
        send the browser to. After the user approves, OpenAI redirects to
        `/ai/chatgpt/callback`, which stores the tokens and sends the browser on to the
        dashboard with `?chatgpt=connected` or `?chatgpt=error&reason=<reason>`.
        Requires `KARVON_CHATGPT_CLIENT_ID`; 409 otherwise.
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatGPTConnectStart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /ai/chatgpt:
    delete:
      tags: [ai]
      operationId: disconnectChatGPT
      summary: Forget the connected ChatGPT account
      description: |
        Deletes the stored tokens; generations fall back to the API key or the manual
        flow. The user removes Karvon from their ChatGPT settings to revoke it at OpenAI.
      responses:
        '204': { description: Disconnected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /ai/chatgpt/callback:
    get:
      tags: [ai]
      operationId: chatGPTCallback
      summary: OpenAI's redirect back after Sign in with ChatGPT
      description: |
        Called by the browser, not the dashboard, so it carries no API key. It always
        answers with a redirect to `KARVON_CHATGPT_RETURN_URL` (default: the CORS
        origin) carrying `chatgpt=connected`, or `chatgpt=error` and a `reason` of
        `access_denied`, `expired`, `no_plan_access`, `failed` or `not_configured`.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 4096 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: error_description, in: query, required: false, schema: { type: string, maxLength: 2048 } }
      responses:
        '302': { description: Back to the dashboard }

  /ai/generations:
    get:
      tags: [ai]
      operationId: listAiGenerations
      summary: Generation history
      parameters:
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated generations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIGenerationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [ai]
      operationId: createAiGeneration
      summary: Build the prompt for a brief, and run it when the provider can
      description: |
        A manual provider returns the generation at `awaiting_paste` with the prompt to
        copy into ChatGPT; an API provider runs the round trip and returns it `parsed`.
        Either way the brief, the prompt and its version are stored, so what produced a
        piece of copy is still answerable months later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIGenerationCreate' }
      responses:
        '201':
          description: Created generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIGeneration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: The AI provider refused the request or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /ai/generations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [ai]
      operationId: getAiGeneration
      summary: One generation with its brief, prompt and parsed output
      responses:
        '200':
          description: Generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIGeneration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ai/generations/{id}/parse:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [ai]
      operationId: parseAiGeneration
      summary: Validate and store the JSON the operator pasted back from ChatGPT
      description: |
        Nothing is imported here. Output that does not match the schema is refused with
        422; output that parses but has salvageable problems is stored with the
        problems listed in `parsed.warnings`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIParseRequest' }
      responses:
        '200':
          description: The parsed generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIGeneration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /ai/generations/{id}/import:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [ai]
      operationId: importAiGeneration
      summary: Turn chosen parts of a parsed generation into components and variants
      description: |
        Omitting both index lists imports everything. Imported content lands at
        `ai_generated` and still has to go through review before a campaign can use it.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIImportRequest' }
      responses:
        '200':
          description: What was imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /sending-accounts:
    get:
      tags: [sending-accounts]
      operationId: listSendingAccounts
      summary: The mailboxes Instantly sends from, with their recent stats
      parameters:
        - name: status
          in: query
          description: Instantly's numeric account status
          schema: { type: integer }
        - name: q
          in: query
          description: Case-insensitive match on the account's address
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Sending accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SendingAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /sending-accounts/sync:
    post:
      tags: [sending-accounts]
      operationId: syncSendingAccounts
      summary: Queue a refresh of the account list and its daily stats from Instantly
      responses:
        '202': { description: Sync queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sending-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [sending-accounts]
      operationId: getSendingAccount
      summary: One mailbox with its daily series and the campaigns it serves
      responses:
        '200':
          description: Sending account detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendingAccountDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /newsletter/audiences:
    get:
      tags: [newsletter]
      operationId: listNewsletterAudiences
      summary: The Mailchimp audiences known here
      responses:
        '200':
          description: Audiences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NewsletterAudience' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /newsletter/audiences/sync:
    post:
      tags: [newsletter]
      operationId: syncNewsletterAudiences
      summary: Queue a refresh of the audience list from Mailchimp
      responses:
        '202': { description: Sync queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /newsletter/audiences/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [newsletter]
      operationId: updateNewsletterAudience
      summary: Set the audience's opt-in policy, default tags and default flag
      description: |
        `allow_single_opt_in` decides whether a push asks Mailchimp for `subscribed` or
        for `pending`. Leaving it off means every contact still confirms by email,
        whatever consent we already hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsletterAudienceUpdate' }
      responses:
        '200':
          description: Updated audience
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterAudience' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /newsletter/audiences/{id}/webhook:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [newsletter]
      operationId: registerNewsletterWebhook
      summary: Register this audience's Mailchimp webhook
      responses:
        '200':
          description: Updated audience
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterAudience' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: Mailchimp refused the registration or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [newsletter]
      operationId: deleteNewsletterWebhook
      summary: Remove this audience's Mailchimp webhook
      responses:
        '200':
          description: Updated audience
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterAudience' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /newsletter/eligibility:
    get:
      tags: [newsletter]
      operationId: listNewsletterEligibility
      summary: Who could be pushed to the newsletter now, and who is one step short
      description: |
        Every row carries the consent gate's decision, including the reason a contact
        is not eligible, so the UI never has to re-derive the rule.
      parameters:
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: audience_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleContactList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /newsletter/push:
    post:
      tags: [newsletter]
      operationId: pushNewsletterContacts
      summary: Queue contacts for Mailchimp
      description: |
        The consent gate is applied per contact rather than to the request as a whole:
        contacts that pass are queued, contacts that do not come back in `rejected`
        with the reason, and the request still succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsletterPushRequest' }
      responses:
        '200':
          description: What was queued and what was refused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterPushResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /newsletter/subscriptions:
    get:
      tags: [newsletter]
      operationId: listNewsletterSubscriptions
      summary: Every subscription with what we asked for and what Mailchimp says
      parameters:
        - name: status
          in: query
          description: Repeatable filter on Mailchimp's status
          schema:
            type: array
            items: { $ref: '#/components/schemas/SubscriptionStatus' }
          style: form
          explode: true
        - name: sync_status
          in: query
          description: Repeatable filter on our own push state
          schema:
            type: array
            items: { $ref: '#/components/schemas/SyncStatus' }
          style: form
          explode: true
        - name: audience_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Case-insensitive match on the contact's address
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated subscriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterSubscriptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /newsletter/subscriptions/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [newsletter]
      operationId: retryNewsletterSubscription
      summary: Re-queue a subscription whose push to Mailchimp failed
      responses:
        '200':
          description: The re-queued subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /newsletter/stats:
    get:
      tags: [newsletter]
      operationId: getNewsletterStats
      summary: Subscription counts by status and the eligible → subscribed conversion
      responses:
        '200':
          description: Newsletter statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /campaign-analytics/overview:
    get:
      tags: [campaign-analytics]
      operationId: getCampaignOverview
      summary: Campaign counts, the funnel and the overall metrics for the whole area
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /campaign-analytics/campaigns/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [campaign-analytics]
      operationId: getCampaignAnalytics
      summary: One campaign's metrics beside Instantly's, with the disagreements called out
      description: |
        Our numbers and Instantly's are reported side by side and never merged: the two
        count differently, and `mismatch` treats the gap as a signal rather than
        hiding it behind an average.
      parameters:
        - name: days
          in: query
          description: Length of the daily series
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Campaign analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignAnalytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaign-analytics/campaigns/{id}/variants:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [campaign-analytics]
      operationId: getCampaignVariantAnalytics
      summary: How each variant of this campaign performed
      responses:
        '200':
          description: Per-variant metrics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VariantAnalytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /campaign-analytics/components:
    get:
      tags: [campaign-analytics]
      operationId: getComponentAnalytics
      summary: How each component performed across the sends that carried it
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ComponentType' }
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: since
          in: query
          description: Only sends at or after this instant
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Per-component metrics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ComponentAnalytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaign-analytics/sending-accounts:
    get:
      tags: [campaign-analytics]
      operationId: getAccountAnalytics
      summary: Per-mailbox deliverability, ours beside Instantly's
      responses:
        '200':
          description: Per-account metrics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountAnalytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /campaign-analytics/funnel:
    get:
      tags: [campaign-analytics]
      operationId: getFunnelAnalytics
      summary: The cold → subscriber funnel, optionally for one campaign
      description: |
        `current` is how many contacts sit in the stage now; `ever_reached` how many
        have passed through it. The two differ because a contact only moves forward,
        so the second is the one to read as a conversion.
      parameters:
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Funnel steps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FunnelStep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /activity:
    get:
      tags: [campaign-analytics]
      operationId: listActivity
      summary: The whole contact event log, newest first
      parameters:
        - name: type
          in: query
          description: Repeatable event type filter
          schema:
            type: array
            items: { $ref: '#/components/schemas/ContactEventType' }
          style: form
          explode: true
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: contact_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /domains/settings:
    get:
      tags: [domains]
      operationId: getDomainSettings
      summary: The Cloudflare Registrar connection and the purchase limits
      responses:
        '200':
          description: Connection settings; the API token itself is never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [domains]
      operationId: updateDomainSettings
      summary: Set the Cloudflare account ID, the API token and the on/off switch
      description: |
        Every field is optional: an omitted field is left as it is, and `null` clears
        `account_id` or `api_token`. The token needs the account's Registrar edit
        permission and is stored AES-GCM encrypted. Switching `enabled` off stops new
        searches and purchases, and any domain of a running purchase that has not been
        sent to Cloudflare yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainSettingsUpdate' }
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /domains/settings/test:
    post:
      tags: [domains]
      operationId: testDomainConnection
      summary: Prove the token and account ID with one read that costs nothing
      description: Works while the connection is switched off, so a token can be checked first.
      responses:
        '200':
          description: The connection works
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainConnectionTest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The account ID or the token is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Cloudflare rejected the token or account, or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /domains/search:
    get:
      tags: [domains]
      operationId: searchDomains
      summary: Suggest domains for a keyword, with prices
      description: |
        Fast and based on Cloudflare's cached data, so it is for discovery only. Use
        `POST /domains/check` for the authoritative answer before buying; the purchase
        itself checks again.
      parameters:
        - name: q
          in: query
          required: true
          description: A keyword, phrase or partial domain
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: extensions
          in: query
          description: Repeatable extension filter, e.g. `extensions=com&extensions=dev`
          schema:
            type: array
            maxItems: 20
            items: { type: string, maxLength: 63 }
          style: form
          explode: true
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainOfferList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The Cloudflare connection is not configured or is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Cloudflare rejected the token or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /domains/check:
    post:
      tags: [domains]
      operationId: checkDomains
      summary: Real-time availability and price for up to 20 domains
      description: |
        Asks the registries directly, reserving nothing. Names are normalised (lower
        case, punycode, no scheme or path) and de-duplicated; the answer keeps the
        request's order. Only offers with `purchasable: true` can be bought.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainCheckRequest' }
      responses:
        '200':
          description: One offer per distinct domain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainOfferList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The Cloudflare connection is not configured or is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Cloudflare rejected the token or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /domains/purchases:
    get:
      tags: [domains]
      operationId: listDomainPurchases
      summary: Past and running purchases, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated purchases, each with its domains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainPurchaseList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [domains]
      operationId: createDomainPurchase
      summary: Buy up to 10 domains at once (billed, not refundable)
      description: |
        The confirm step of checkout. `confirm` must be `true`, and every domain carries
        the registration price the operator was shown (`expected_cost_cents`, from
        `pricing.registration_cost_cents` of a check).

        Before anything is queued every domain is checked with Cloudflare again. If any
        is gone, premium, or now dearer than confirmed, nothing is bought and the 409
        lists each offending domain in `details` (`field` is `domains[i]`). Otherwise
        the purchase is queued and answered with 202; poll `GET /domains/purchases/{id}`
        until `status` is no longer `queued` or `processing`.

        Limits: at most 10 domains per purchase, and only one purchase runs at a time
        (409 while another is queued or processing). Each domain is checked once more
        right before it is registered and skipped if its price rose above the confirmed
        one. Registrations are charged to the Cloudflare account's default payment
        method; the price is the first-year cost.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainPurchaseCreate' }
      responses:
        '202':
          description: The purchase is queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainPurchase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Another purchase is in progress, the connection is not ready, or some
            domains can no longer be bought as confirmed (listed in `details`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Cloudflare rejected the token or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /domains/purchases/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [domains]
      operationId: getDomainPurchase
      summary: One purchase and how each of its domains ended
      responses:
        '200':
          description: The purchase
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainPurchase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /domains/registrations:
    get:
      tags: [domains]
      operationId: listDomainRegistrations
      summary: Every domain the Cloudflare account owns, oldest first
      description: Read live from Cloudflare; domains registered outside Karvon are included.
      responses:
        '200':
          description: The account's domains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainRegistrationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The Cloudflare connection is not configured or is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Cloudflare rejected the token or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /domains/registrations/{domain}:
    parameters:
      - $ref: '#/components/parameters/DomainPath'
    get:
      tags: [domains]
      operationId: getDomainRegistration
      summary: One domain the account owns
      responses:
        '200':
          description: The domain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Cloudflare connection is not configured or is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Cloudflare rejected the token or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [domains]
      operationId: updateDomainRegistration
      summary: Switch automatic renewal on or off
      description: |
        The only setting Cloudflare's API can change today. Turning `auto_renew` on
        authorises Cloudflare to charge the renewal up to 30 days before expiry. A 202
        means Cloudflare accepted the change but had not applied it when it answered;
        the body is then the domain as it stood.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainRegistrationUpdate' }
      responses:
        '200':
          description: The updated domain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainRegistration' }
        '202':
          description: Accepted, still being applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The connection is not ready, or Cloudflare refused the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Cloudflare rejected the token or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspace/settings:
    get:
      tags: [workspace]
      operationId: getWorkspaceSettings
      summary: The Google Workspace connection and what domain-wide delegation needs
      description: |
        `service_account_client_id` and `scopes` are what the Admin console asks for
        under Security → Access and data control → API controls → Domain-wide
        delegation. The key itself is never returned.
      responses:
        '200':
          description: Connection settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [workspace]
      operationId: updateWorkspaceSettings
      summary: Set the service-account key, the admin it acts as, and the on/off switch
      description: |
        Every field is optional: an omitted field is left as it is, and `null` clears
        `admin_email` or `service_account_key`. The key is the JSON file downloaded
        from the Google Cloud console; it is checked to be a service-account key and
        stored AES-GCM encrypted. `admin_email` must be a super admin of the Workspace
        account. Switching `enabled` off stops new setups and any running one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceSettingsUpdate' }
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/settings/test:
    post:
      tags: [workspace]
      operationId: testWorkspaceConnection
      summary: Prove the key, the delegation and the admin with one read that costs nothing
      description: Works while the connection is switched off, so a key can be checked first.
      responses:
        '200':
          description: The connection works; the Workspace account it reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceConnectionTest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The admin email or the key is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Google refused the service account, or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspace/domains:
    get:
      tags: [workspace]
      operationId: listWorkspaceDomains
      summary: Domains set up (or being set up) for Workspace mail, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated domains, each with its mailboxes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDomainList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [workspace]
      operationId: createWorkspaceDomain
      summary: Set up Workspace mail on a domain and create its mailboxes (billed per mailbox)
      description: |
        The domain's DNS must be a zone in the Cloudflare account (every domain bought
        through `/domains/purchases` is), and both the Cloudflare and the Google
        connections must be ready. Each mailbox is a Workspace user and a paid licence,
        so `confirm` must be `true`; at most 5 mailboxes per domain.

        Answered with 202. In the background the domain is added to Workspace, the
        verification, MX (`smtp.google.com`), SPF and DMARC (`p=none`) records are
        published in Cloudflare, Google is asked to verify the domain until it can see
        the record, and the mailboxes are created with generated passwords. Poll
        `GET /workspace/domains/{domain}` until `status` leaves `provisioning`.

        Existing mail records are never overwritten, except ones that say the domain
        has no mail (a null MX, `v=spf1 -all`); anything else fails the setup with
        `dns_conflict` for a person to resolve.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceDomainCreate' }
      responses:
        '202':
          description: The setup is queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDomain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            The domain is already set up, has no zone in the Cloudflare account, or a
            connection is not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Cloudflare rejected the token or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspace/domains/{domain}:
    parameters:
      - $ref: '#/components/parameters/DomainPath'
    get:
      tags: [workspace]
      operationId: getWorkspaceDomain
      summary: One domain's setup and its mailboxes
      responses:
        '200':
          description: The setup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/domains/{domain}/retry:
    parameters:
      - $ref: '#/components/parameters/DomainPath'
    post:
      tags: [workspace]
      operationId: retryWorkspaceDomain
      summary: Resume a failed setup where it stopped
      description: |
        Steps already done are skipped. Mailboxes Google refused are sent again; one
        whose address already belonged to someone else (`address_taken`) stays failed.
      responses:
        '202':
          description: The setup is queued again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The setup is not failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/domains/{domain}/dkim:
    parameters:
      - $ref: '#/components/parameters/DomainPath'
    put:
      tags: [workspace]
      operationId: publishWorkspaceDkim
      summary: Publish the DKIM key generated in the Admin console
      description: |
        Google has no API for DKIM keys. Generate one in the Admin console (Apps →
        Google Workspace → Gmail → Authenticate email → the domain → Generate new
        record) and send the TXT value shown there. It is published at
        `<selector>._domainkey.<domain>` in Cloudflare, replacing an older key, and the
        domain becomes `active`. Then press "Start authentication" in the Admin console.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceDkimUpdate' }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDomain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The domain is still provisioning or failed, or the Cloudflare connection is not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502':
          description: Cloudflare rejected the change or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspace/domains/{domain}/mailboxes:
    parameters:
      - $ref: '#/components/parameters/DomainPath'
    post:
      tags: [workspace]
      operationId: addWorkspaceMailboxes
      summary: Add mailboxes to a domain that is already set up (billed per mailbox)
      description: |
        For a domain in `dkim_required` or `active`. The domain goes back to
        `provisioning` while the new mailboxes are created (every finished step is
        skipped) and returns to where it was. A domain holds at most 5 mailboxes,
        failed ones included until they are removed with
        `DELETE /workspace/mailboxes/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceMailboxesAdd' }
      responses:
        '202':
          description: The mailboxes are queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDomain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The domain is provisioning or failed, or the connection is not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/mailboxes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [workspace]
      operationId: deleteWorkspaceMailbox
      summary: Remove a failed mailbox, freeing its slot
      description: |
        Only a mailbox that was never created (`failed`) is removed; it exists nowhere
        but here. A created mailbox is a Workspace user and is deleted in the Admin
        console.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The mailbox is not failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspace/mailboxes/{id}/instantly:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [workspace]
      operationId: connectWorkspaceMailboxToInstantly
      summary: Start connecting a created mailbox to Instantly
      description: |
        Uses Instantly's Google OAuth flow. Open `auth_url` in a new tab and sign in
        as the mailbox (its password is at `GET /workspace/mailboxes/{id}/credentials`);
        the session lives about ten minutes. Karvon follows it in the background:
        poll the domain until the mailbox's `instantly_status` leaves `connecting`.
        On `connected`, warmup is turned on when `warmup` was true and the sending
        accounts are refreshed. Asking again while a session is open returns it; after
        `failed` or `expired` it starts a new one.

        Needs the Instantly source (Sources) enabled with a key carrying the
        accounts:create, accounts:read and accounts:update scopes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceInstantlyConnect' }
      responses:
        '200':
          description: The session to sign in through
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceInstantlyConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The mailbox is not created or already connected, or Instantly is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Instantly rejected the key or is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspace/mailboxes/{id}/credentials:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [workspace]
      operationId: getWorkspaceMailboxCredentials
      summary: A created mailbox's address and initial password
      description: |
        What a person signs in with to connect the mailbox to the sending tool. Sent
        with `Cache-Control: no-store`. A password changed in Google later is not
        reflected here.
      responses:
        '200':
          description: The credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMailboxCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The mailbox has not been created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Static API key, `Authorization: Bearer <KARVON_API_KEY>`"

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    LeadIdPath:
      name: leadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsentIdPath:
      name: consentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SuppressionIdPath:
      name: suppressionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookTokenPath:
      name: token
      in: path
      required: true
      description: The opaque token minted when the webhook was registered
      schema: { type: string, minLength: 8, maxLength: 200 }
    DomainPath:
      name: domain
      in: path
      required: true
      description: A fully qualified domain name, e.g. example.com
      schema: { type: string, minLength: 3, maxLength: 253 }

    ThreadIdPath:
      name: threadId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    OutreachOutcomeFilter:
      name: outcome
      in: query
      description: Repeatable outcome filter
      schema:
        type: array
        items: { $ref: '#/components/schemas/OutreachOutcome' }
      style: form
      explode: true
    OutreachSort:
      name: sort
      in: query
      schema:
        type: string
        default: last_contacted_at:desc
        enum: [last_contacted_at:desc, last_contacted_at:asc, last_replied_at:desc, email:asc, email:desc,
               campaign:asc, outcome:asc]

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Action not allowed in the resource's current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Request body or query failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
      additionalProperties: false

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }

    Health:
      type: object
      required: [ok, db, queue]
      properties:
        ok: { type: boolean }
        db: { type: boolean }
        queue: { type: boolean }
        version: { type: string }

    SourceKind:
      type: string
      enum: [apify, outscraper, emailable, cloudflare, google_workspace]

    SourceRole:
      type: string
      description: |
        What a source is for. Maps providers supply business listings; the verifier
        checks email addresses; the registrar buys domains; the mailboxes source
        creates Google Workspace mailboxes. All store their key the same way.
      enum: [maps, verifier, registrar, mailboxes]

    Source:
      type: object
      required: [id, kind, role, name, has_key, cost_per_1k_cents, enabled, max_active_runs, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SourceKind' }
        role: { $ref: '#/components/schemas/SourceRole' }
        name: { type: string }
        has_key: { type: boolean, description: Whether an API key is stored; the key itself is never returned }
        cost_per_1k_cents: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        max_active_runs:
          type: integer
          minimum: 1
          maximum: 64
          description: |
            Maps providers only. How many vendor runs this account may have in flight
            at once, across every scrape job. A location that finds every slot taken
            waits in the queue and starts as soon as another run finishes. Match it to
            the vendor plan: each Apify run is given KARVON_APIFY_RUN_MEMORY_MB.
        last_tested_at: { type: string, format: date-time, nullable: true }
        last_test_ok: { type: boolean, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SourceUpdate:
      type: object
      properties:
        api_key:
          type: string
          nullable: true
          maxLength: 500
          description: Plaintext key; stored AES-GCM encrypted. Omit to keep, null to clear.
        cost_per_1k_cents: { type: integer, minimum: 0, maximum: 1000000 }
        enabled: { type: boolean }
        max_active_runs: { type: integer, minimum: 1, maximum: 64 }
        name: { type: string, minLength: 1, maxLength: 100 }
      additionalProperties: false

    ScrapeCategory:
      type: object
      description: |
        A named set of search terms that pre-fills the Create scrape form. Terms are
        stored normalized: whitespace collapsed, blanks and case-insensitive duplicates
        dropped.
      required: [id, name, terms, is_default, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        terms:
          type: array
          items: { type: string }
        is_default: { type: boolean, description: Seeded category; editable but not deletable }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScrapeCategoryCreate:
      type: object
      required: [name, terms]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        terms:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 120 }
      additionalProperties: false

    ScrapeCategoryUpdate:
      type: object
      description: Omitted fields are left unchanged.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        terms:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 120 }
      additionalProperties: false

    ExclusionKind:
      type: string
      description: |
        What a global exclusion matches. `company` is the normalised business name;
        `domain` is a website domain and every address at it; `email_domain` is
        addresses at a domain only; `email` is one exact address. Domain kinds cover
        subdomains too.
      enum: [company, email, email_domain, domain]

    ExclusionMatchMode:
      type: string
      description: |
        How the value is compared. `exact` (the default) matches the normalised
        name, or the domain and its subdomains. `prefix` (company rules only) also
        matches names that start with it word by word ("planet fitness" matches
        "Planet Fitness - Austin"). `contains` (company, domain and email_domain
        rules) matches a brand whose locations each have their own name and
        domain: for a company, names containing the words anywhere ("ymca" matches
        "Osage Prairie YMCA"); for a domain, hosts containing the text anywhere
        ("ymca" matches orymca.org and ymcaofcallaway.org).
      enum: [exact, prefix, contains]

    ExclusionSource:
      type: string
      description: Where the rule was created from
      enum: [manual, business, verification, lead, contact]

    ExclusionRef:
      type: object
      nullable: true
      description: The rule that globally excludes this record; null when none does
      required: [id, kind, value, display_value]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ExclusionKind' }
        value: { type: string, description: The normalised match key }
        display_value: { type: string }

    ExclusionAffected:
      type: object
      description: How many stored records a rule covers right now
      required: [businesses, emails, contacts, live_leads]
      properties:
        businesses: { type: integer, format: int64 }
        emails: { type: integer, format: int64, description: Distinct scraped addresses }
        contacts: { type: integer, format: int64 }
        live_leads:
          type: integer
          format: int64
          description: |
            Campaign leads the rule keeps out of outreach: waiting, in flight, or
            already taken out of their campaign by the exclusion
      additionalProperties: false

    GlobalExclusion:
      type: object
      required: [id, kind, value, display_value, match_mode, source, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ExclusionKind' }
        value: { type: string, description: The normalised match key }
        display_value: { type: string, description: What was entered or clicked }
        match_mode: { $ref: '#/components/schemas/ExclusionMatchMode' }
        reason: { type: string, nullable: true }
        source: { $ref: '#/components/schemas/ExclusionSource' }
        source_ref_id:
          type: string
          format: uuid
          nullable: true
          description: The business, verification row, lead or contact it was created from
        created_at: { type: string, format: date-time }
        removed_at: { type: string, format: date-time, nullable: true }
        removed_note: { type: string, nullable: true }
        affected: { $ref: '#/components/schemas/ExclusionAffected' }

    GlobalExclusionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/GlobalExclusion' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    GlobalExclusionCreate:
      type: object
      required: [kind, value]
      properties:
        kind: { $ref: '#/components/schemas/ExclusionKind' }
        value:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            A company name, an address, or a domain. Domains may be given as a URL,
            a bare host or "@host"; an address given for a domain kind uses its domain.
        match_mode: { $ref: '#/components/schemas/ExclusionMatchMode' }
        reason: { type: string, maxLength: 1000, nullable: true }
        source: { $ref: '#/components/schemas/ExclusionSource' }
        source_ref_id: { type: string, format: uuid, nullable: true }
      additionalProperties: false

    ExclusionPreview:
      type: object
      required: [kind, value, display_value, match_mode, affected, sample_businesses, sample_emails]
      properties:
        kind: { $ref: '#/components/schemas/ExclusionKind' }
        value: { type: string, description: The normalised match key }
        display_value: { type: string }
        match_mode: { $ref: '#/components/schemas/ExclusionMatchMode' }
        existing_id:
          type: string
          format: uuid
          nullable: true
          description: An active rule with the same kind and key, when one exists
        affected: { $ref: '#/components/schemas/ExclusionAffected' }
        sample_businesses:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ExclusionPreviewBusiness' }
        sample_emails:
          type: array
          maxItems: 10
          items: { type: string }
        warning:
          type: string
          nullable: true
          description: Set when the rule looks broader than intended, e.g. a free-mail domain

    ExclusionPreviewBusiness:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        domain: { type: string, nullable: true }

    ExclusionCheckRequest:
      type: object
      description: Any combination; the first rule matching any of them is returned
      properties:
        business_id: { type: string, format: uuid }
        email: { type: string, maxLength: 320 }
        domain: { type: string, maxLength: 500 }
        company: { type: string, maxLength: 500 }
      additionalProperties: false

    ExclusionCheckResult:
      type: object
      required: [excluded]
      properties:
        excluded: { type: boolean }
        exclusion: { $ref: '#/components/schemas/ExclusionRef' }

    ExclusionBulkCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/GlobalExclusionCreate' }
      additionalProperties: false

    ExclusionBulkResult:
      type: object
      required: [created, results]
      properties:
        created: { type: integer, description: How many items were created }
        results:
          type: array
          items: { $ref: '#/components/schemas/ExclusionBulkItemResult' }

    ExclusionBulkItemResult:
      type: object
      required: [index, status]
      properties:
        index: { type: integer, description: Position of the item in the request }
        status:
          type: string
          description: |
            `created`; `duplicate` when an active rule with the same kind and key
            exists (409 from POST /exclusions); `invalid` when the item fails
            validation (422); `failed` otherwise
          enum: [created, duplicate, invalid, failed]
        exclusion: { $ref: '#/components/schemas/GlobalExclusion' }
        error: { $ref: '#/components/schemas/Error' }

    BrandScanGroupBy:
      type: string
      description: |
        How the brand scan groups businesses. `domain` (the default) is the
        registrable website domain, which catches a brand whose locations each have
        their own name; `name` is the normalised name; `name_prefix` is the first
        two words of the normalised name, which catches "Crunch Fitness - Amarillo"
        and "Crunch Fitness Lubbock" together.
      enum: [domain, name, name_prefix]
      default: domain

    BrandCandidate:
      type: object
      required: [group_by, key, display_name, locations, cities, states, state_list, distinct_names,
                 distinct_domains, total_reviews, excluded_locations, suggested_rule, sample_businesses]
      properties:
        group_by: { $ref: '#/components/schemas/BrandScanGroupBy' }
        key:
          type: string
          description: |
            The group key: a registrable domain, or a normalised name or name
            prefix. It is what a dismissal is keyed by and what an exclusion rule
            on the group stores as its value.
        display_name: { type: string, description: The most common business name in the group }
        top_domain: { type: string, nullable: true, description: The most common registrable domain in the group }
        locations: { type: integer, format: int64, description: Stored listings in the group }
        cities: { type: integer, format: int64, description: Distinct city and state pairs }
        states: { type: integer, format: int64 }
        state_list:
          type: array
          items: { type: string }
          description: Distinct states, upper case, sorted
        distinct_names: { type: integer, format: int64 }
        distinct_domains: { type: integer, format: int64 }
        total_reviews: { type: integer, format: int64, description: Sum of Google review counts }
        avg_rating: { type: number, format: double, nullable: true }
        excluded_locations:
          type: integer
          format: int64
          description: Listings in the group some exclusion already covers
        existing_exclusion:
          $ref: '#/components/schemas/ExclusionRef'
        dismissal:
          $ref: '#/components/schemas/BrandScanDismissalRef'
        suggested_rule:
          $ref: '#/components/schemas/GlobalExclusionCreate'
        sample_businesses:
          type: array
          maxItems: 5
          description: The most-reviewed listings in the group
          items: { $ref: '#/components/schemas/BrandSampleBusiness' }

    BrandSampleBusiness:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        domain: { type: string, nullable: true }

    BrandCandidateList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BrandCandidate' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    BrandScanDismissalRef:
      type: object
      nullable: true
      description: Set when the group is dismissed (only listed with include_dismissed)
      required: [id]
      properties:
        id: { type: string, format: uuid }
        note: { type: string, nullable: true }

    BrandScanDismissal:
      type: object
      required: [id, group_by, key, created_at]
      properties:
        id: { type: string, format: uuid }
        group_by: { $ref: '#/components/schemas/BrandScanGroupBy' }
        key: { type: string }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    BrandScanDismissalCreate:
      type: object
      required: [group_by, key]
      properties:
        group_by: { $ref: '#/components/schemas/BrandScanGroupBy' }
        key: { type: string, minLength: 1, maxLength: 320, description: The `key` the scan returned }
        note: { type: string, maxLength: 1000, nullable: true }
      additionalProperties: false

    BrandScanDismissalList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BrandScanDismissal' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    SourceTestResult:
      type: object
      required: [ok, kind]
      properties:
        ok: { type: boolean }
        kind: { $ref: '#/components/schemas/SourceKind' }
        listings_returned: { type: integer, description: Maps providers only }
        credits:
          type: integer
          format: int64
          nullable: true
          description: Remaining balance, returned when testing the email verifier
        tested_at: { type: string, format: date-time }

    JobStatus:
      type: string
      enum: [queued, running, done, failed, cancelled]

    Location:
      type: object
      description: >
        A place to search. Both fields are optional: city + state pins one city,
        state alone covers the whole state, city alone is resolved by the provider,
        and an empty object (or an empty locations array) means every US state.
      properties:
        city: { type: string, maxLength: 120 }
        state: { type: string, maxLength: 60 }

    JobConfig:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 120 }
        locations:
          type: array
          description: Omitted or empty means every US state.
          maxItems: 300
          items: { $ref: '#/components/schemas/Location' }
        max_per_query:
          type: integer
          minimum: -1
          maximum: 1000
          default: 100
          description: >-
            Places to fetch per search term per location. -1 means every place in the
            area, which is how a whole state is covered; spend is then bounded by the
            provider's per-run charge cap rather than by this number.
        crawl_emails: { type: boolean, default: true }
        concurrency: { type: integer, minimum: 1, maximum: 100, default: 8 }
        recrawl_of:
          type: string
          format: uuid
          readOnly: true
          description: Set on a re-crawl of a job; the job whose businesses were copied in.
        recrawl_targets:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/RecrawlTarget' }
          description: Set on every re-crawl job; what it looked for.
        social_networks:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/SocialScrapeNetwork' }
          description: Set on a social media scrape; the networks whose pages it read.
        social_missing_email_only:
          type: boolean
          readOnly: true
          description: Set on a social media scrape that skipped businesses already having an email.
      additionalProperties: false

    JobCreate:
      type: object
      required: [name, source_id, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        source_id: { type: string, format: uuid }
        config: { $ref: '#/components/schemas/JobConfig' }
      additionalProperties: false

    JobStats:
      type: object
      required: [queries_total, queries_done, listings_found, sites_total, sites_crawled, emails_found, cost_cents]
      properties:
        queries_total: { type: integer }
        queries_done: { type: integer }
        queries_failed: { type: integer }
        listings_found: { type: integer }
        sites_total: { type: integer }
        sites_crawled: { type: integer }
        emails_found: { type: integer }
        duplicates:
          type: integer
          description: >-
            Listings that resolved onto a business the job already had. A run over
            areas that do not overlap should report close to zero.
        cost_cents: { type: integer, format: int64 }

    Job:
      type: object
      required: [id, name, status, source_id, config, stats, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        source_id: { type: string, format: uuid }
        source_name: { type: string }
        source_kind: { $ref: '#/components/schemas/SourceKind' }
        config: { $ref: '#/components/schemas/JobConfig' }
        stats: { $ref: '#/components/schemas/JobStats' }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    JobList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    JobEstimate:
      type: object
      required: [queries, est_listings, est_cost_cents]
      properties:
        queries: { type: integer }
        est_listings: { type: integer }
        est_cost_cents: { type: integer, format: int64 }
        cost_per_1k_cents: { type: integer }
        unlimited:
          type: boolean
          description: >-
            The job asks for every place in each area, so est_listings and
            est_cost_cents are an assumed ceiling rather than a limit the provider
            will enforce.

    EmailSource:
      type: string
      enum: [mailto, regex, provider, facebook]

    BusinessEmail:
      type: object
      required: [id, email, source, is_primary, found_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        source: { $ref: '#/components/schemas/EmailSource' }
        page_url: { type: string, nullable: true }
        is_primary: { type: boolean }
        verification_id: { type: string, format: uuid, nullable: true }
        verified_status:
          allOf:
            - $ref: '#/components/schemas/VerificationTag'
          nullable: true
        verification_score: { type: integer, nullable: true }
        typo_suggestion: { type: string, nullable: true }
        exclusion: { $ref: '#/components/schemas/ExclusionRef' }
        found_at: { type: string, format: date-time }

    SocialNetwork:
      type: string
      enum: [facebook, instagram, tiktok, youtube, linkedin, x, threads, pinterest, yelp, linktree]

    BusinessSocial:
      type: object
      description: A social profile the business's website links to, found by the crawl stage.
      required: [id, network, handle, url, found_at]
      properties:
        id: { type: string, format: uuid }
        network: { $ref: '#/components/schemas/SocialNetwork' }
        handle:
          type: string
          description: The profile's identifier on its network, e.g. "tahcrossfit" or "company/acme".
        url:
          type: string
          description: Canonical profile URL.
        page_url:
          type: string
          nullable: true
          description: The website page the link was found on; null when the business's own website is the profile.
        found_at: { type: string, format: date-time }

    Business:
      type: object
      required: [id, name, suppressed, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, nullable: true }
        name: { type: string }
        category: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        zip: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        domain: { type: string, nullable: true }
        rating: { type: number, format: double, nullable: true }
        reviews: { type: integer, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        suppressed: { type: boolean }
        exclusion: { $ref: '#/components/schemas/ExclusionRef' }
        notes: { type: string, nullable: true }
        first_job_id: { type: string, format: uuid, nullable: true }
        first_job_name: { type: string, nullable: true, description: Name of the job that first found this business, null once that job is deleted }
        primary_email: { type: string, nullable: true }
        primary_email_source: { $ref: '#/components/schemas/EmailSource' }
        primary_email_verified_status:
          allOf:
            - $ref: '#/components/schemas/VerificationTag'
          nullable: true
          description: Tag of the primary address, null until it has been verified
        primary_email_verification_score: { type: integer, nullable: true }
        emails_count: { type: integer }
        socials:
          type: array
          description: Social profiles the business's website links to.
          items: { $ref: '#/components/schemas/BusinessSocial' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BusinessDetail:
      allOf:
        - $ref: '#/components/schemas/Business'
        - type: object
          properties:
            emails:
              type: array
              items: { $ref: '#/components/schemas/BusinessEmail' }
            raw:
              type: object
              additionalProperties: true
              nullable: true

    BusinessList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Business' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    BusinessUpdate:
      type: object
      properties:
        suppressed: { type: boolean }
        notes: { type: string, maxLength: 2000, nullable: true }
      additionalProperties: false

    BusinessBulkRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: string, format: uuid }
        action:
          type: string
          enum: [suppress, unsuppress]
      additionalProperties: false

    BulkResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }

    BusinessExportRequest:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        category:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: Matches a business whose category equals any of the values
        state: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 200 }
        has_email: { type: boolean }
        suppressed: { type: boolean }
        q: { type: string, maxLength: 200 }
        email_source: { $ref: '#/components/schemas/EmailSource' }
        verification_tag:
          type: array
          items: { $ref: '#/components/schemas/VerificationTag' }
        ids:
          type: array
          maxItems: 5000
          items: { type: string, format: uuid }
          description: When present, exports exactly these rows and ignores the filters
      additionalProperties: false

    RecrawlTarget:
      type: string
      enum: [emails, socials]
      description: What a re-crawl looks for; a business lacking it is revisited.

    RecrawlJobRequest:
      type: object
      properties:
        targets:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/RecrawlTarget' }
          description: Defaults to ["emails"].
      additionalProperties: false

    BusinessRecrawlRequest:
      type: object
      description: The same selection as BusinessExportRequest, plus what to look for.
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/RecrawlTarget' }
        job_id: { type: string, format: uuid }
        category:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: Matches a business whose category equals any of the values
        state: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 200 }
        has_email: { type: boolean }
        suppressed: { type: boolean }
        q: { type: string, maxLength: 200 }
        email_source: { $ref: '#/components/schemas/EmailSource' }
        verification_tag:
          type: array
          items: { $ref: '#/components/schemas/VerificationTag' }
        ids:
          type: array
          maxItems: 5000
          items: { type: string, format: uuid }
          description: When present, re-crawls exactly these businesses and ignores the filters
      additionalProperties: false

    SocialScrapeNetwork:
      type: string
      enum: [facebook]
      description: A network whose public pages a social media scrape can read.

    BusinessSocialScrapeRequest:
      type: object
      description: The same selection as BusinessExportRequest, plus which networks to read.
      required: [networks]
      properties:
        networks:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/SocialScrapeNetwork' }
        missing_email_only:
          type: boolean
          default: true
          description: Skip businesses that already have an email address.
        job_id: { type: string, format: uuid }
        category:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: Matches a business whose category equals any of the values
        state: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 200 }
        has_email: { type: boolean }
        suppressed: { type: boolean }
        q: { type: string, maxLength: 200 }
        email_source: { $ref: '#/components/schemas/EmailSource' }
        verification_tag:
          type: array
          items: { $ref: '#/components/schemas/VerificationTag' }
        ids:
          type: array
          maxItems: 5000
          items: { type: string, format: uuid }
          description: When present, scrapes exactly these businesses and ignores the filters
      additionalProperties: false

    ScraperStatsJobEmails:
      type: object
      required: [job_id, name, emails]
      properties:
        job_id: { type: string, format: uuid }
        name: { type: string }
        emails: { type: integer }

    ScraperStats:
      type: object
      required: [businesses, with_email, jobs_total, emails_per_job]
      properties:
        businesses: { type: integer, format: int64 }
        with_email: { type: integer, format: int64 }
        jobs_total: { type: integer, format: int64 }
        emails_total: { type: integer, format: int64 }
        last_job:
          allOf:
            - $ref: '#/components/schemas/Job'
          nullable: true
        emails_per_job:
          type: array
          items: { $ref: '#/components/schemas/ScraperStatsJobEmails' }

    DashboardBucket:
      type: string
      enum: [day, week, month]

    DashboardRange:
      type: object
      required: [from, to, days, tz, bucket, previous_from, previous_to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive }
        days: { type: integer }
        tz: { type: string }
        bucket: { $ref: '#/components/schemas/DashboardBucket' }
        previous_from: { type: string, format: date }
        previous_to: { type: string, format: date }

    DashboardCosts:
      type: object
      description: |
        Spend in US cents. Scraping, verification and domains come from what was
        recorded as charged; mailboxes and tools are monthly prices from the server's
        configuration, prorated by the day (0 when not configured).
      required: [total_cents, scraping_cents, verification_cents, domains_cents,
                 mailboxes_cents, tools_cents, lines]
      properties:
        total_cents: { type: integer, format: int64 }
        scraping_cents: { type: integer, format: int64, description: Maps provider runs }
        verification_cents: { type: integer, format: int64, description: Paid verifier checks }
        domains_cents: { type: integer, format: int64, description: Registered sending domains }
        mailboxes_cents: { type: integer, format: int64, description: Provisioned Workspace mailboxes, prorated }
        tools_cents: { type: integer, format: int64, description: Flat monthly tooling, prorated }
        lines:
          type: array
          description: The same five figures with labels and how each was worked out, in display order
          items: { $ref: '#/components/schemas/DashboardCostLine' }

    DashboardCostLine:
      type: object
      required: [key, label, cents, basis]
      properties:
        key:
          type: string
          enum: [scraping, verification, domains, mailboxes, tools]
        label: { type: string }
        cents: { type: integer, format: int64 }
        basis: { type: string, description: How the figure was reached, in plain words }

    DashboardLeadCostStep:
      type: object
      required: [key, label, count, cost_cents, cost_per_unit_cents, rate_from_previous, formula]
      properties:
        key:
          type: string
          enum: [businesses, emails_found, emails_verified, leads_contacted, replied, successful_leads]
        label: { type: string }
        count: { type: integer, format: int64 }
        cost_cents:
          type: integer
          format: int64
          description: |
            Spend charged to reach this stage — lead data for the first two, plus
            verification for verified addresses, everything from leads emailed on
        cost_per_unit_cents:
          type: number
          format: double
          nullable: true
          description: cost_cents / count to a hundredth of a cent (a business can cost under 1¢); null when count is 0
        rate_from_previous:
          type: number
          format: double
          nullable: true
          description: count / the previous step's count; null on the first step. Can exceed 1.
        formula: { type: string, description: 'The arithmetic with real figures, e.g. "$412.50 total spend ÷ 7 successful leads = $58.93 each". Unit prices under $1 carry four decimals ("$0.0032").' }

    DashboardLeadCost:
      type: object
      description: What one successful lead cost, and the working behind it.
      required: [successful_leads, imported_successful_leads, cost_per_successful_lead_cents, definition,
                 formula, steps, notes]
      properties:
        successful_leads:
          type: integer
          format: int64
          description: |
            Every campaign's: `outreach.successful_leads` plus the opportunities of the
            campaigns started in Instantly (`outreach.imported.interested`).
        imported_successful_leads:
          type: integer
          format: int64
          description: The part of `successful_leads` that is Instantly's opportunity count
        cost_per_successful_lead_cents:
          type: number
          format: double
          nullable: true
          description: costs.total_cents / successful_leads to a hundredth of a cent; null when there were none
        definition: { type: string, description: What counts as a successful lead }
        formula: { type: string, description: The headline arithmetic }
        steps:
          type: array
          description: The funnel from businesses scraped to successful leads, in order
          items: { $ref: '#/components/schemas/DashboardLeadCostStep' }
        notes:
          type: array
          description: Caveats to print under the figure
          items: { type: string }

    DashboardLeads:
      type: object
      required: [businesses, businesses_with_email, email_find_rate, emails_found,
                 emails_verified, emails_green, paid_checks]
      properties:
        businesses: { type: integer, format: int64, description: Businesses scraped }
        businesses_with_email: { type: integer, format: int64, description: Of those, how many have an address }
        email_find_rate: { type: number, format: double, description: 'businesses_with_email / businesses, 0–1' }
        emails_found: { type: integer, format: int64 }
        emails_verified: { type: integer, format: int64, description: Addresses whose verdict was set in the window }
        emails_green: { type: integer, format: int64, description: Verified deliverable — the ones used for outreach }
        paid_checks: { type: integer, format: int64, description: Addresses sent to the paid verifier }

    DashboardOutreach:
      type: object
      required: [campaigns_launched, sends, leads_contacted, opened, clicked, replied,
                 positive_replies, bounced, unsubscribed, interested, meetings_booked,
                 successful_leads, open_rate, reply_rate, positive_reply_rate, bounce_rate,
                 imported]
      properties:
        campaigns_launched: { type: integer, format: int64 }
        sends: { type: integer, format: int64 }
        leads_contacted: { type: integer, format: int64, description: Distinct contacts emailed }
        opened: { type: integer, format: int64 }
        clicked: { type: integer, format: int64 }
        replied: { type: integer, format: int64, description: Human replies; auto-replies excluded }
        positive_replies: { type: integer, format: int64 }
        bounced: { type: integer, format: int64 }
        unsubscribed: { type: integer, format: int64 }
        interested: { type: integer, format: int64, description: Contacts marked interested in the window }
        meetings_booked: { type: integer, format: int64 }
        successful_leads:
          type: integer
          format: int64
          description: Distinct contacts with a positive reply, an interested mark or a booked meeting
        open_rate: { type: number, format: double }
        reply_rate: { type: number, format: double }
        positive_reply_rate: { type: number, format: double }
        bounce_rate: { type: number, format: double }
        imported: { $ref: '#/components/schemas/DashboardImported' }

    DashboardImported:
      type: object
      description: |
        The campaigns started in Instantly's own app (`source: instantly`), from
        Instantly's per-day campaign analytics over the window's calendar days. Those
        campaigns send nothing through Karvon, so none of this is in the outreach
        figures beside it; it is kept apart from them, never merged. The lead cost
        does add it in (`lead_cost.imported_successful_leads`), since the spend pays
        for these campaigns too. It also counts differently: a reply or an opportunity is counted
        on the day it came in, not with the send that drew it, so its rates are
        approximate over short windows. Instantly reports no bounces or unsubscribes
        per day, so there are none here.
      required: [campaigns, sends, leads_contacted, opened, clicked, replied, interested,
                 open_rate, reply_rate, interested_rate]
      properties:
        campaigns: { type: integer, format: int64, description: Imported campaigns that sent or heard back in the window }
        sends: { type: integer, format: int64 }
        leads_contacted: { type: integer, format: int64, description: Leads emailed for the first time }
        opened: { type: integer, format: int64, description: 'Unique opens, summed by day' }
        clicked: { type: integer, format: int64, description: 'Unique clicks, summed by day' }
        replied: { type: integer, format: int64, description: 'Unique replies, summed by day' }
        interested: { type: integer, format: int64, description: Instantly's opportunities }
        open_rate: { type: number, format: double, description: opened / sends }
        reply_rate: { type: number, format: double, description: replied / sends }
        interested_rate: { type: number, format: double, description: interested / sends }

    DashboardSummary:
      type: object
      required: [costs, leads, outreach, lead_cost]
      properties:
        costs: { $ref: '#/components/schemas/DashboardCosts' }
        lead_cost: { $ref: '#/components/schemas/DashboardLeadCost' }
        leads: { $ref: '#/components/schemas/DashboardLeads' }
        outreach: { $ref: '#/components/schemas/DashboardOutreach' }

    DashboardPoint:
      type: object
      required: [bucket_start, businesses, emails_found, emails_green, sends, replied,
                 positive_replies, successful_leads, scraping_cents, verification_cents,
                 domains_cents, mailboxes_cents, tools_cents, cost_cents,
                 imported_sends, imported_replied, imported_interested]
      properties:
        bucket_start: { type: string, format: date, description: First local day of the bucket }
        businesses: { type: integer, format: int64 }
        emails_found: { type: integer, format: int64 }
        emails_green: { type: integer, format: int64 }
        sends: { type: integer, format: int64 }
        replied: { type: integer, format: int64 }
        positive_replies: { type: integer, format: int64 }
        successful_leads: { type: integer, format: int64, description: Counted in the bucket of each contact's first success in the window }
        scraping_cents: { type: integer, format: int64 }
        verification_cents: { type: integer, format: int64 }
        domains_cents: { type: integer, format: int64 }
        mailboxes_cents: { type: integer, format: int64 }
        tools_cents: { type: integer, format: int64 }
        cost_cents: { type: integer, format: int64, description: Sum of the five }
        imported_sends: { type: integer, format: int64, description: Sends of campaigns started in Instantly; not in sends }
        imported_replied: { type: integer, format: int64, description: 'Their unique replies, on the day they came in; not in replied' }
        imported_interested: { type: integer, format: int64, description: 'Their opportunities, on the day Instantly reports them' }

    DashboardCampaign:
      type: object
      description: |
        One campaign's figures for the window. A campaign started in Instantly
        (`source: instantly`) is read from Instantly's per-day analytics over the
        window's calendar days: `positive_replies` is its opportunities, and `bounced`
        is null because Instantly reports no bounces per day.
      required: [id, name, status, source, launched_at, leads_total, sends, leads_contacted,
                 opened, replied, positive_replies, bounced, open_rate, reply_rate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        source: { $ref: '#/components/schemas/CampaignSource' }
        launched_at: { type: string, format: date-time, nullable: true }
        leads_total: { type: integer, format: int64 }
        sends: { type: integer, format: int64, description: In the window }
        leads_contacted: { type: integer, format: int64 }
        opened: { type: integer, format: int64 }
        replied: { type: integer, format: int64 }
        positive_replies: { type: integer, format: int64 }
        bounced: { type: integer, format: int64, nullable: true }
        open_rate: { type: number, format: double }
        reply_rate: { type: number, format: double }

    DashboardCount:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer, format: int64 }

    DashboardBreakdowns:
      type: object
      required: [categories, states, verification_mix, campaign_status]
      properties:
        categories:
          type: array
          description: Top business categories in the window
          items: { $ref: '#/components/schemas/DashboardCount' }
        states:
          type: array
          description: Top states in the window
          items: { $ref: '#/components/schemas/DashboardCount' }
        verification_mix:
          type: array
          description: Addresses verified in the window by tag, green first; label is a VerificationTag
          items: { $ref: '#/components/schemas/DashboardCount' }
        campaign_status:
          type: array
          description: Every campaign by its status now (a snapshot, not windowed)
          items: { $ref: '#/components/schemas/DashboardCount' }

    DashboardReport:
      type: object
      required: [range, generated_at, current, previous, all_time, series, campaigns, breakdowns]
      properties:
        range: { $ref: '#/components/schemas/DashboardRange' }
        generated_at: { type: string, format: date-time }
        current: { $ref: '#/components/schemas/DashboardSummary' }
        previous:
          allOf:
            - $ref: '#/components/schemas/DashboardSummary'
          description: The equal-length window that ends where this one starts
        all_time:
          allOf:
            - $ref: '#/components/schemas/DashboardSummary'
          description: Everything up to the end of the window
        series:
          type: array
          items: { $ref: '#/components/schemas/DashboardPoint' }
        campaigns:
          type: array
          description: Up to 10 campaigns that sent in the window or are running, busiest first; imported ones included
          items: { $ref: '#/components/schemas/DashboardCampaign' }
        breakdowns: { $ref: '#/components/schemas/DashboardBreakdowns' }

    VerificationTag:
      type: string
      description: |
        The colour band a final score falls into. The UI must never convey a tag by
        colour alone; `tag_label` carries the text that goes with it.
      enum: [green, light_green, yellow, orange, red]

    Pass2Status:
      type: string
      description: |
        The third-party verdict. Only `deliverable`, `risky` and `undeliverable` are
        conclusive and billed. `unknown` and `error` leave the free score in place.
        Whether the address may be tried again is not read from this field but from
        `third_party_sent_at`: `unknown` came from the provider and is final, while
        `error` from a call that never reached it leaves the address unsent.
      enum: [deliverable, risky, unknown, undeliverable, error]

    VerificationPass:
      type: string
      description: "`self` is the free local pass; `third_party` is the paid one."
      enum: [self, third_party]

    VerificationCheckStatus:
      type: string
      enum: [pass, fail, skip]

    VerificationCheck:
      type: object
      description: One line of the Pass 1 breakdown. The points always sum to pass1_score.
      required: [key, label, status, points, max]
      properties:
        key: { type: string, example: mx }
        label: { type: string, example: MX records present }
        status: { $ref: '#/components/schemas/VerificationCheckStatus' }
        points: { type: integer, description: Points this check actually contributed }
        max: { type: integer, description: Points it could have contributed }
        detail: { type: string }

    VerificationBusiness:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    EmailVerification:
      type: object
      required: [id, email, domain, pass1_score, free_score, pass2_credits, final_score,
                 verification_tag, tag_label, business_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        domain: { type: string }
        pass1_score: { type: integer, minimum: 0, maximum: 85 }
        pass1_hard_fail:
          type: string
          nullable: true
          description: Key of the check that zeroed the score, null when none did
        pass1_verified_at: { type: string, format: date-time, nullable: true }
        free_score:
          type: integer
          minimum: 0
          maximum: 89
          description: |
            The weighted combination of every free provider. Capped below 90 on
            purpose: only the paid provider can tag an address Verified.
        free_scored_at: { type: string, format: date-time, nullable: true }
        pass2_score: { type: integer, nullable: true }
        pass2_status:
          allOf:
            - $ref: '#/components/schemas/Pass2Status'
          nullable: true
        pass2_verified_at: { type: string, format: date-time, nullable: true }
        third_party_sent_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this address was handed to a third-party verifier. Non-null means it
            has had its one and only send: it can never be sent to a third party
            again, whatever the provider answered or failed to answer. Null means it
            has never left our infrastructure.
        pass2_credits: { type: integer }
        final_score: { type: integer, minimum: 0, maximum: 100 }
        verification_tag: { $ref: '#/components/schemas/VerificationTag' }
        tag_label: { type: string, example: Likely valid }
        typo_suggestion:
          type: string
          nullable: true
          description: The corrected address, offered to the operator rather than applied
        last_error: { type: string, nullable: true }
        business_count: { type: integer }
        exclusion: { $ref: '#/components/schemas/ExclusionRef' }
        updated_at: { type: string, format: date-time }

    EmailVerificationDetail:
      allOf:
        - $ref: '#/components/schemas/EmailVerification'
        - type: object
          properties:
            pass1_checks:
              type: array
              items: { $ref: '#/components/schemas/VerificationCheck' }
            provider_results:
              type: array
              description: |
                How each free provider contributed to free_score. Every weighted
                provider always appears, including ones that were switched off or
                could not be reached, so the breakdown is always complete.
              items: { $ref: '#/components/schemas/VerificationProviderResult' }
            pass2_raw:
              type: object
              additionalProperties: true
              nullable: true
            businesses:
              type: array
              items: { $ref: '#/components/schemas/VerificationBusiness' }

    EmailVerificationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EmailVerification' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    VerificationProviderKey:
      type: string
      description: |
        Which provider produced a result. The list grows as providers are added, so
        clients must tolerate an unknown value rather than switching exhaustively.
      example: reacher

    VerificationProviderStatus:
      type: string
      description: |
        What the provider managed to determine. Only `scored` contributes to the
        weighted score; every other status means the provider's weight was
        redistributed over the providers that did answer.
      enum: [scored, inconclusive, skipped, unavailable, error]

    VerificationProviderResult:
      type: object
      description: One provider's contribution to the weighted free score.
      required: [provider, label, status, score, weight, effective_weight, contribution]
      properties:
        provider: { $ref: '#/components/schemas/VerificationProviderKey' }
        label: { type: string, example: Reacher }
        status: { $ref: '#/components/schemas/VerificationProviderStatus' }
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: The provider's normalised answer; meaningful only when status is `scored`
        weight:
          type: integer
          description: The percentage configured for this provider when the address was scored
        effective_weight:
          type: integer
          description: |
            The weight after redistributing the share of providers that contributed
            nothing. Zero for a provider that did not contribute.
        contribution:
          type: number
          format: double
          description: score × effective_weight ÷ 100. The contributions sum to free_score before the cap.
        reason: { type: string }
        disqualifying:
          type: boolean
          description: |
            This provider found a fact no other provider's opinion can override — bad
            syntax, a disposable domain, an automated mailbox, a domain that accepts
            no mail. The free score is 0 and no provider contributed.
        error: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: Small structured detail the provider kept; never a raw vendor payload
        duration_ms: { type: integer, format: int64 }

    VerificationProviderHealth:
      type: object
      required: [provider, label, stage, weighted, toggleable, description, enabled, weight]
      properties:
        provider: { $ref: '#/components/schemas/VerificationProviderKey' }
        label: { type: string }
        stage:
          type: string
          enum: [free, paid]
          description: '`free` providers are weighted together; `paid` runs afterwards and costs credits'
        weighted: { type: boolean, description: Whether it takes part in the weighted score }
        toggleable: { type: boolean, description: Whether it can be switched off }
        description: { type: string }
        enabled: { type: boolean }
        weight: { type: integer, description: The configured percentage; 0 for the paid provider }
        healthy:
          type: boolean
          nullable: true
          description: |
            null when readiness cannot be determined, which is the case for providers
            that need no probing. Render that as "not applicable", never as healthy.
        error: { type: string, description: Why the readiness probe failed }

    VerificationSettings:
      type: object
      required: [weights, enabled, paid_enabled, paid_threshold, paid_min_score]
      properties:
        weights:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: Percentage per weighted provider, keyed by provider. Must total 100.
          example: { existing: 30, mailchecker: 20, reacher: 50 }
        enabled:
          type: object
          additionalProperties: { type: boolean }
          description: Which toggleable providers are switched on, keyed by provider
          example: { mailchecker: true, reacher: false, paid: true }
        paid_enabled:
          type: boolean
          description: Switches the paid stage off entirely
        paid_threshold:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            The ceiling, exclusive. An address whose free score reaches it is already
            confident enough and is never billed.
        paid_min_score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            The floor, inclusive. An address below it is never billed, because a paid
            provider would only confirm what the free checks already established.
        auto_self_verify:
          type: boolean
          description: |
            Runs the free self pass automatically. A sweep every
            KARVON_VERIFY_AUTO_INTERVAL starts a self run over every address that has
            never been scored, so emails found by scrapes are verified without anyone
            clicking. The third-party pass is never started automatically. Always
            present in responses; omit it on update to keep the current value.

    VerificationSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/VerificationSettings'
      description: The full settings object; every field is replaced, except auto_self_verify, which is kept when omitted.

    VerificationSettingsView:
      type: object
      required: [settings, providers, free_max_score, weight_total]
      properties:
        settings: { $ref: '#/components/schemas/VerificationSettings' }
        providers:
          type: array
          description: The provider catalogue with current settings and live readiness
          items: { $ref: '#/components/schemas/VerificationProviderHealth' }
        free_max_score:
          type: integer
          description: |
            The ceiling on the weighted free score. Below the Verified band on
            purpose, so the UI can explain why three perfect free scores do not
            produce 100.
        weight_total:
          type: integer
          description: What the weights must add up to, so the client can validate before submitting
        updated_at: { type: string, format: date-time, nullable: true }

    VerificationRunFilter:
      type: object
      description: Which addresses a run covers. Stored verbatim on the run.
      properties:
        scope:
          type: string
          default: all
          enum: [all, selection]
        ids:
          type: array
          maxItems: 5000
          items: { type: string, format: uuid }
        business_ids:
          type: array
          maxItems: 5000
          items: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        tags:
          type: array
          items: { $ref: '#/components/schemas/VerificationTag' }
        min_score: { type: integer, minimum: 0, maximum: 100 }
        include_suppressed: { type: boolean, default: false }
        stale_after_days:
          type: integer
          minimum: 0
          description: Self runs only; skips addresses scored more recently than this
      additionalProperties: false

    VerificationRunEstimateRequest:
      type: object
      required: [pass]
      properties:
        pass: { $ref: '#/components/schemas/VerificationPass' }
        filter: { $ref: '#/components/schemas/VerificationRunFilter' }
      additionalProperties: false

    VerificationRunEstimate:
      type: object
      required: [emails, needs_self, cached, credits_needed, est_cost_cents]
      properties:
        emails:
          type: integer
          format: int64
          description: How many addresses the run would actually process
        needs_self:
          type: integer
          format: int64
          description: Matching addresses excluded because they have not been through the free checks
        cached:
          type: integer
          format: int64
          description: |
            Matching addresses skipped because they have already been sent to a
            third party once. They are skipped permanently and are never billed.
        credits_needed: { type: integer, format: int64 }
        cost_per_1k_cents: { type: integer }
        est_cost_cents: { type: integer, format: int64 }
        balance_credits:
          type: integer
          format: int64
          nullable: true
          description: The provider's reported balance, null when it cannot be reached

    VerificationRunCreate:
      type: object
      required: [pass]
      properties:
        pass: { $ref: '#/components/schemas/VerificationPass' }
        filter: { $ref: '#/components/schemas/VerificationRunFilter' }
        max_cost_cents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Required for a third_party run. Send the estimate you displayed; the
            server re-estimates and refuses if the real cost exceeds it.
      additionalProperties: false

    VerificationRun:
      type: object
      required: [id, pass, status, filter, total, done, failed, skipped, credits_used,
                 est_cost_cents, auto, created_at]
      properties:
        id: { type: string, format: uuid }
        pass: { $ref: '#/components/schemas/VerificationPass' }
        status: { $ref: '#/components/schemas/JobStatus' }
        filter: { $ref: '#/components/schemas/VerificationRunFilter' }
        total: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        skipped:
          type: integer
          description: |
            Addresses that had already been sent to a third party, were below the
            gate, or no longer exist
        credits_used: { type: integer }
        est_cost_cents: { type: integer, format: int64 }
        source_id: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true }
        auto:
          type: boolean
          description: Started by the automatic self-verify sweep rather than by an operator
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    VerificationRunList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VerificationRun' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    VerificationTagCounts:
      type: object
      required: [green, light_green, yellow, orange, red]
      properties:
        green: { type: integer, format: int64 }
        light_green: { type: integer, format: int64 }
        yellow: { type: integer, format: int64 }
        orange: { type: integer, format: int64 }
        red: { type: integer, format: int64 }

    VerificationStats:
      type: object
      required: [total, by_tag, self_verified, third_party_verified, needs_self,
                 qualifying_for_third_party, qualifying_est_cost_cents,
                 credits_used_total, credits_used_30d, active_runs]
      properties:
        total: { type: integer, format: int64 }
        by_tag: { $ref: '#/components/schemas/VerificationTagCounts' }
        self_verified: { type: integer, format: int64 }
        third_party_verified: { type: integer, format: int64 }
        needs_self:
          type: integer
          format: int64
          description: Addresses on the master list that have never completed Pass 1
        qualifying_for_third_party:
          type: integer
          format: int64
          description: Addresses that would be sent, and billed for, by a paid run today
        qualifying_est_cost_cents: { type: integer, format: int64 }
        credits_used_total: { type: integer, format: int64 }
        credits_used_30d: { type: integer, format: int64 }
        balance_credits: { type: integer, format: int64, nullable: true }
        active_runs: { type: integer, format: int64 }
        last_self_run_at: { type: string, format: date-time, nullable: true }
        last_third_party_run_at: { type: string, format: date-time, nullable: true }

    SSEProgress:
      type: object
      description: Payload of an SSE `progress` event
      properties:
        queries_done: { type: integer }
        queries_total: { type: integer }
        sites_crawled: { type: integer }
        sites_total: { type: integer }
        listings_found: { type: integer }
        emails_found: { type: integer }
        cost_cents: { type: integer, format: int64 }

    SSELog:
      type: object
      description: Payload of an SSE `log` event
      required: [level, msg, ts]
      properties:
        level: { type: string, enum: [debug, info, warn, error] }
        msg: { type: string }
        ts: { type: string, format: date-time }

    SSEStatus:
      type: object
      description: Payload of an SSE `status` event
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/JobStatus' }
        error: { type: string, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    CampaignStatus:
      type: string
      description: |
        A campaign's own state. `scheduled` waits for `scheduled_launch_at`, then moves
        to `launching` on its own. `launching` is the window in which leads are being
        pushed to Instantly; it is transient and ends in `active` or `failed`.
      enum: [draft, ready, scheduled, launching, active, paused, completed, failed, archived]

    CampaignSource:
      type: string
      description: |
        Where the campaign was started. `karvon` campaigns are built here and launched
        into Instantly. `instantly` campaigns were started in Instantly's own app and
        are imported by the campaign sync: they are mirrored, not edited, so their
        sequence, leads and sending accounts can only be changed in Instantly, and
        their counters come from Instantly's analytics.
      enum: [karvon, instantly]

    CampaignLeadStatus:
      type: string
      description: |
        The delivery state of one contact inside one campaign. `excluded` means a
        global exclusion took the lead out of the campaign.
      enum: [pending, pushing, active, paused, completed, replied, bounced,
             unsubscribed, skipped, suppressed, failed, excluded]

    CampaignVariantStatus:
      type: string
      description: Whether a variant is still being handed out on this campaign.
      enum: [active, paused]

    ContactStage:
      type: string
      description: |
        A contact's position in the cold → subscriber funnel. The first eleven are the
        funnel proper and a contact only ever moves forward through them; the last six
        are terminal, outrank every funnel stage, and only `unsubscribed` can replace
        another terminal.
      enum: [cold, queued_for_instantly, contacted, engaged, replied, interested,
             permission_requested, permission_captured, newsletter_eligible,
             mailchimp_pending, mailchimp_subscribed,
             not_interested, wrong_person, do_not_contact, invalid_email, bounced, unsubscribed]

    ContactSource:
      type: string
      description: How a contact first entered the system.
      enum: [business_import, csv, manual]

    SuppressionReason:
      type: string
      description: |
        Why a contact is not to be contacted. `unsubscribed`, `bounced` and
        `invalid_email` are permanent and can never be lifted; the other three are
        operator judgements and can be.
      enum: [unsubscribed, bounced, invalid_email, do_not_contact, not_interested, wrong_person]

    SuppressionSource:
      type: string
      description: What wrote a suppression.
      enum: [instantly_webhook, mailchimp_webhook, reconcile, manual, import]

    ConsentSource:
      type: string
      description: How newsletter permission was captured.
      enum: [explicit_reply, form, verbal_confirmed]

    ComponentType:
      type: string
      description: |
        The slots an email is assembled from, in assembly order. `subject` is its own
        line; the rest are joined with blank lines.
      enum: [subject, hook, problem, value_prop, proof, cta, closing, ps]

    ContentStatus:
      type: string
      description: |
        The review state of a component or variant: draft → reviewed → approved →
        active, with AI output entering at `ai_generated`. Only `approved` and
        `active` content may go into a live campaign.
      enum: [draft, ai_generated, reviewed, approved, active, archived]

    SubscriptionStatus:
      type: string
      description: |
        What Mailchimp says about a subscription. `local_pending` is ours: the row
        exists here but has not been pushed yet.
      enum: [local_pending, pending, subscribed, unsubscribed, cleaned, transactional,
             archived, compliance_blocked, error]

    RequestedSubscriptionStatus:
      type: string
      description: What we asked Mailchimp for, which the audience's opt-in policy decides.
      enum: [pending, subscribed, unsubscribed]

    SyncStatus:
      type: string
      description: How far a subscription has got in being pushed to Mailchimp.
      enum: [queued, syncing, synced, failed]

    ContactEventType:
      type: string
      description: One per thing that can appear on a contact's timeline.
      enum: [imported, queued, pushed, push_failed, sent, opened, clicked, replied,
             auto_replied, interested, not_interested, wrong_person, meeting_booked,
             bounced, unsubscribed, skipped, suppressed, suppression_lifted,
             permission_requested, consent_captured, consent_revoked,
             newsletter_eligible, newsletter_pushed, newsletter_pending,
             newsletter_subscribed, newsletter_unsubscribed, newsletter_cleaned,
             newsletter_profile_updated, stage_changed, note, removed_from_provider]

    ContactEventSource:
      type: string
      description: What put an event on the timeline.
      enum: [instantly_webhook, mailchimp_webhook, reconcile, manual, system, import]

    ReplyClassification:
      type: string
      enum: [positive, negative, neutral, auto_reply, out_of_office, unknown]

    SendSource:
      type: string
      description: Whether a send row was learnt from a webhook or from reconciliation.
      enum: [webhook, reconcile]

    ProviderName:
      type: string
      description: Instantly sends the cold email; Mailchimp sends the newsletter.
      enum: [instantly, mailchimp]

    ProviderEventSource:
      type: string
      enum: [webhook, replay, test]

    SyncRunKind:
      type: string
      enum: [instantly_campaign, instantly_campaigns_all, instantly_leads_full,
             instantly_accounts, instantly_webhook_replay, instantly_inbox, mailchimp_members,
             mailchimp_audiences]

    SyncRunStatus:
      type: string
      enum: [running, done, failed]

    AIProviderName:
      type: string
      description: |
        `chatgpt_plan` runs on the ChatGPT account connected with Sign in with ChatGPT
        and counts against its Plus or Pro plan.
      enum: [manual_chatgpt, openai_api, chatgpt_plan]

    ChatGPTConnectionStatus:
      type: string
      description: |
        `needs_reconnect` means OpenAI stopped accepting the sign-in (revoked, or unused
        for 30 days); generations fall back until the operator connects again.
      enum: [connected, needs_reconnect, disconnected]

    ChatGPTConnection:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ChatGPTConnectionStatus' }
        email: { type: string, nullable: true }
        connected_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }

    ChatGPTConnectStart:
      type: object
      required: [authorize_url]
      properties:
        authorize_url: { type: string, description: Send the browser here }

    AIMode:
      type: string
      description: |
        `manual` means the operator carries the prompt to ChatGPT and pastes the answer
        back; `api` means the server makes the call itself.
      enum: [manual, api]

    GenerationStatus:
      type: string
      enum: [prompt_built, awaiting_paste, parsed, imported, failed]

    Metrics:
      type: object
      description: |
        One bucket of send-level counts and the rates derived from them. Every rate is
        over `sends`, except `unsubscribe_rate`, which is over `unique_contacts`
        because a person unsubscribes once however many emails reached them.
      required: [sends, unique_contacts, opened, clicked, replied, positive_replies,
                 bounced, unsubscribed, open_rate, click_rate, reply_rate,
                 positive_reply_rate, bounce_rate, unsubscribe_rate]
      properties:
        sends: { type: integer, format: int64 }
        unique_contacts: { type: integer, format: int64 }
        opened: { type: integer, format: int64 }
        clicked: { type: integer, format: int64 }
        replied: { type: integer, format: int64 }
        positive_replies: { type: integer, format: int64 }
        bounced: { type: integer, format: int64 }
        unsubscribed: { type: integer, format: int64 }
        open_rate: { type: number, format: double }
        click_rate: { type: number, format: double }
        reply_rate: { type: number, format: double }
        positive_reply_rate: { type: number, format: double }
        bounce_rate: { type: number, format: double }
        unsubscribe_rate: { type: number, format: double }

    CountsByKey:
      type: object
      description: Counts keyed by a status, stage or other discriminator.
      additionalProperties: { type: integer, format: int64 }

    Campaign:
      type: object
      required: [id, name, status, source, steps, weights_version, leads_total, leads_pushed,
                 contacted, replied, interested, bounced, unsubscribed, sends_total,
                 sends_bounced, eligible, subscribed, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        source: { $ref: '#/components/schemas/CampaignSource' }
        brief:
          type: object
          additionalProperties: true
          nullable: true
          description: The free-form brief the AI generator is given
        schedule:
          type: object
          additionalProperties: true
          nullable: true
          description: Sending window and timezone, as Instantly understands them
        settings:
          type: object
          additionalProperties: true
          nullable: true
        steps: { type: integer, minimum: 1, maximum: 5 }
        step_delays:
          type: array
          nullable: true
          description: Days to wait before each follow-up step
          items: { type: integer }
        weights_version:
          type: integer
          description: |
            Bumped whenever the variant mix changes. An assignment records the version
            it was made under, so a re-weighting never rewrites an email already sent.
        instantly_campaign_id: { type: string, nullable: true }
        instantly_status: { type: integer, nullable: true }
        instantly_sending_status: { type: string, nullable: true }
        scheduled_launch_at:
          type: string
          format: date-time
          nullable: true
          description: When a `scheduled` campaign launches; cleared by a launch now or an unschedule
        launched_at: { type: string, format: date-time, nullable: true }
        paused_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_error: { type: string, nullable: true }
        error: { type: string, nullable: true }
        leads_total: { type: integer }
        leads_pushed: { type: integer }
        contacted: { type: integer, format: int64 }
        replied: { type: integer, format: int64 }
        interested: { type: integer, format: int64 }
        bounced: { type: integer, format: int64 }
        unsubscribed: { type: integer, format: int64 }
        sends_total: { type: integer, format: int64 }
        sends_bounced: { type: integer, format: int64 }
        eligible:
          type: integer
          format: int64
          description: Leads whose contact has reached a newsletter stage
        subscribed: { type: integer, format: int64 }
        last_activity_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CampaignSummary:
      type: object
      description: Just enough of a campaign to name it in another resource's response.
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/CampaignStatus' }

    CampaignDetail:
      allOf:
        - $ref: '#/components/schemas/Campaign'
        - type: object
          required: [sending_accounts, variants, lead_counts, stage_counts, checklist]
          properties:
            sending_accounts:
              type: array
              items: { $ref: '#/components/schemas/SendingAccount' }
            variants:
              type: array
              items: { $ref: '#/components/schemas/CampaignVariant' }
            lead_counts: { $ref: '#/components/schemas/CountsByKey' }
            stage_counts: { $ref: '#/components/schemas/CountsByKey' }
            checklist: { $ref: '#/components/schemas/CampaignChecklist' }

    CampaignList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Campaign' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    CampaignCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        brief: { type: object, additionalProperties: true }
        schedule: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
        steps: { type: integer, minimum: 1, maximum: 5 }
        step_delays:
          type: array
          maxItems: 5
          items: { type: integer, minimum: 0, maximum: 365 }
      additionalProperties: false

    CampaignUpdate:
      type: object
      description: Every field is optional; omitted fields are left as they are.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        brief: { type: object, additionalProperties: true }
        schedule: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
        steps: { type: integer, minimum: 1, maximum: 5 }
        step_delays:
          type: array
          maxItems: 5
          items: { type: integer, minimum: 0, maximum: 365 }
      additionalProperties: false

    ChecklistItem:
      type: object
      description: |
        One pre-launch condition. A failing item that is not `blocking` is a warning:
        the campaign can still launch with it unresolved.
      required: [key, ok, blocking, message]
      properties:
        key: { type: string, example: variants }
        ok: { type: boolean }
        blocking: { type: boolean }
        message: { type: string }

    CampaignChecklist:
      type: object
      required: [ready, items]
      properties:
        ready: { type: boolean, description: True when no blocking item is failing }
        items:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }

    CampaignSendingAccountsRequest:
      type: object
      required: [sending_account_ids]
      properties:
        sending_account_ids:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
      additionalProperties: false

    CampaignVariant:
      type: object
      description: One variant attached to a campaign at one step, with its weight.
      required: [campaign_id, variant_id, step, weight, assignment_status, attached_at,
                 name, variant_status, subject_template, body_template]
      properties:
        campaign_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        step: { type: integer, minimum: 1, maximum: 5 }
        weight: { type: integer, minimum: 0 }
        assignment_status: { $ref: '#/components/schemas/CampaignVariantStatus' }
        attached_at: { type: string, format: date-time }
        name: { type: string }
        variant_status: { $ref: '#/components/schemas/ContentStatus' }
        subject_template: { type: string }
        body_template: { type: string }
        component_ids:
          type: array
          items: { type: string, format: uuid }

    CampaignVariantWeight:
      type: object
      required: [variant_id, step, weight]
      properties:
        variant_id: { type: string, format: uuid }
        step: { type: integer, minimum: 1, maximum: 5 }
        weight: { type: integer, minimum: 0, maximum: 1000 }
        status: { $ref: '#/components/schemas/CampaignVariantStatus' }
      additionalProperties: false

    CampaignVariantsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/CampaignVariantWeight' }
      additionalProperties: false

    CampaignLeadBase:
      type: object
      description: One campaign lead, without the joined contact columns.
      required: [id, campaign_id, contact_id, status, push_attempts, open_count,
                 click_count, reply_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        business_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/CampaignLeadStatus' }
        instantly_lead_id: { type: string, nullable: true }
        instantly_status: { type: integer, nullable: true }
        interest_status: { type: integer, nullable: true }
        interest_label: { type: string, nullable: true }
        pushed_at: { type: string, format: date-time, nullable: true }
        push_attempts: { type: integer }
        last_push_error: { type: string, nullable: true }
        last_contacted_at: { type: string, format: date-time, nullable: true }
        last_opened_at: { type: string, format: date-time, nullable: true }
        last_clicked_at: { type: string, format: date-time, nullable: true }
        last_replied_at: { type: string, format: date-time, nullable: true }
        open_count: { type: integer }
        click_count: { type: integer }
        reply_count: { type: integer }
        provider_removed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the lead was deleted from its Instantly campaign, freeing a contact
            slot. The lead, its sends and its timeline stay here.
        provider_removed_reason:
          allOf:
            - $ref: '#/components/schemas/ProviderRemovedReason'
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProviderRemovedReason:
      type: string
      description: |
        Why a lead left Instantly: `cleanup` (a cleanup run), `suppressed` (bounce,
        unsubscribe or a manual suppression), `excluded` (a global exclusion) or
        `manual` (removed from the campaign by an operator).
      enum: [cleanup, suppressed, excluded, manual]

    CampaignLead:
      allOf:
        - $ref: '#/components/schemas/CampaignLeadBase'
        - type: object
          required: [email, lifecycle_stage, variant_names, sends_total]
          properties:
            email: { type: string }
            first_name: { type: string, nullable: true }
            last_name: { type: string, nullable: true }
            company: { type: string, nullable: true }
            title: { type: string, nullable: true }
            lifecycle_stage: { $ref: '#/components/schemas/ContactStage' }
            suppressed_at: { type: string, format: date-time, nullable: true }
            exclusion: { $ref: '#/components/schemas/ExclusionRef' }
            variant_names:
              type: array
              description: The variants assigned to this lead, in step order
              items: { type: string }
            sends_total: { type: integer, format: int64 }

    CampaignLeadDetail:
      allOf:
        - $ref: '#/components/schemas/CampaignLead'
        - type: object
          required: [contact, assignments, sends, events]
          properties:
            contact: { $ref: '#/components/schemas/Contact' }
            assignments:
              type: array
              items: { $ref: '#/components/schemas/VariantAssignment' }
            sends:
              type: array
              items: { $ref: '#/components/schemas/EmailSend' }
            events:
              type: array
              items: { $ref: '#/components/schemas/ContactEvent' }

    CampaignLeadList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CampaignLead' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    LeadImportFilter:
      type: object
      description: Which scraped addresses to bring into the campaign as contacts.
      properties:
        verification_tag:
          type: array
          items: { $ref: '#/components/schemas/VerificationTag' }
        state: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 200 }
        category: { type: string, maxLength: 200 }
        job_id: { type: string, format: uuid }
        business_ids:
          type: array
          maxItems: 5000
          items: { type: string, format: uuid }
        primary_only:
          type: boolean
          default: true
          description: |
            Keeps only each business's primary address. Turn it off to treat every
            address a business holds as a candidate.
        exclude_contacted:
          type: boolean
          default: true
          description: |
            Skips addresses any campaign has already emailed (counted in
            `skipped_contacted`). Instantly forgets a lead once it is cleaned out,
            so this is what stops the same person being emailed twice. Turn it off
            for a deliberate follow-up campaign to people already contacted.
      additionalProperties: false

    LeadImportRequest:
      type: object
      required: [filter]
      properties:
        filter: { $ref: '#/components/schemas/LeadImportFilter' }
      additionalProperties: false

    LeadImportResult:
      type: object
      description: |
        `matched` is what the filter found; the rest is what became of it. The skip
        counts are reported rather than refused so an import is never silently partial.
      required: [matched, imported, skipped_suppressed, skipped_excluded, skipped_existing, skipped_contacted, skipped_invalid, capped]
      properties:
        matched: { type: integer, format: int64 }
        imported: { type: integer }
        skipped_suppressed: { type: integer }
        skipped_excluded:
          type: integer
          description: Addresses the filter reached that a global exclusion keeps out

        skipped_existing: { type: integer }
        skipped_contacted:
          type: integer
          description: Addresses some campaign already emailed, kept out by `exclude_contacted`
        skipped_invalid: { type: integer }
        capped:
          type: boolean
          description: True when the match exceeded the per-import ceiling and was cut short

    Contact:
      type: object
      required: [id, email, domain, source, lifecycle_stage, stage_changed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        domain: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        company: { type: string, nullable: true }
        title: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        business_id: { type: string, format: uuid, nullable: true }
        source: { $ref: '#/components/schemas/ContactSource' }
        lifecycle_stage: { $ref: '#/components/schemas/ContactStage' }
        stage_changed_at: { type: string, format: date-time }
        suppressed_at: { type: string, format: date-time, nullable: true }
        suppression_reason:
          allOf:
            - $ref: '#/components/schemas/SuppressionReason'
          nullable: true
        attributes:
          type: object
          additionalProperties: true
          nullable: true
          description: Merge fields carried into the rendered email
        last_event_at: { type: string, format: date-time, nullable: true }
        exclusion: { $ref: '#/components/schemas/ExclusionRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        has_consent:
          type: boolean
          description: Whether an un-revoked consent record exists; absent on nested contacts
        campaign_count: { type: integer, format: int64 }
        subscription_count: { type: integer, format: int64 }

    ContactCampaignLead:
      type: object
      required: [lead, campaign]
      properties:
        lead: { $ref: '#/components/schemas/CampaignLeadBase' }
        campaign: { $ref: '#/components/schemas/CampaignSummary' }

    ContactDetail:
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          required: [leads, consents, suppressions, subscriptions]
          properties:
            leads:
              type: array
              items: { $ref: '#/components/schemas/ContactCampaignLead' }
            consents:
              type: array
              items: { $ref: '#/components/schemas/Consent' }
            suppressions:
              type: array
              items: { $ref: '#/components/schemas/Suppression' }
            subscriptions:
              type: array
              items: { $ref: '#/components/schemas/NewsletterSubscription' }

    ContactList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ContactUpdate:
      type: object
      description: The address is not editable; every other profile field is.
      properties:
        first_name: { type: string, maxLength: 120, nullable: true }
        last_name: { type: string, maxLength: 120, nullable: true }
        company: { type: string, maxLength: 200, nullable: true }
        title: { type: string, maxLength: 200, nullable: true }
        phone: { type: string, maxLength: 60, nullable: true }
        website: { type: string, maxLength: 500, nullable: true }
        attributes: { type: object, additionalProperties: true }
      additionalProperties: false

    PermissionRequest:
      type: object
      properties:
        note: { type: string, maxLength: 2000 }
      additionalProperties: false

    Consent:
      type: object
      description: |
        One captured permission. The record is never deleted: a revocation stamps it
        rather than removing it, so the audit trail stays complete.
      required: [id, contact_id, source, captured_at, evidence, captured_by, created_at]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/ConsentSource' }
        captured_at: { type: string, format: date-time }
        evidence: { type: string, description: What was actually said, quoted verbatim }
        captured_by: { type: string, description: The operator answering for this record }
        campaign_lead_id: { type: string, format: uuid, nullable: true }
        provider_event_id: { type: string, format: uuid, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoke_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ConsentCreate:
      type: object
      required: [source, evidence, captured_by]
      properties:
        source: { $ref: '#/components/schemas/ConsentSource' }
        captured_at:
          type: string
          format: date-time
          description: When permission was actually given; defaults to now
        evidence: { type: string, minLength: 1, maxLength: 4000 }
        captured_by: { type: string, minLength: 1, maxLength: 200 }
        campaign_lead_id: { type: string, format: uuid }
      additionalProperties: false

    ConsentRevokeRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }
      additionalProperties: false

    Suppression:
      type: object
      required: [id, contact_id, reason, source, created_at]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/SuppressionReason' }
        source: { $ref: '#/components/schemas/SuppressionSource' }
        note: { type: string, nullable: true }
        campaign_lead_id: { type: string, format: uuid, nullable: true }
        provider_event_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        lifted_at: { type: string, format: date-time, nullable: true }
        lifted_note: { type: string, nullable: true }

    SuppressRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: |
            Only the reversible reasons can be applied by hand; the permanent ones come
            from the provider webhooks.
          enum: [do_not_contact, not_interested, wrong_person, unsubscribed]
        note: { type: string, maxLength: 2000 }
      additionalProperties: false

    SuppressionLiftRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why the suppression is being lifted; kept on the record
      additionalProperties: false

    EmailComponent:
      type: object
      required: [id, type, name, body, status, tags, language, placeholders, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ComponentType' }
        name: { type: string }
        body: { type: string }
        status: { $ref: '#/components/schemas/ContentStatus' }
        tags:
          type: array
          items: { type: string }
        language: { type: string, example: en }
        ai_generation_id: { type: string, format: uuid, nullable: true }
        placeholders:
          type: array
          description: The merge fields this body needs, extracted when it was saved
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }

    EmailComponentList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EmailComponent' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ComponentCreate:
      type: object
      required: [type, name, body]
      properties:
        type: { $ref: '#/components/schemas/ComponentType' }
        name: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 60 }
        language: { type: string, minLength: 2, maxLength: 10 }
        status:
          type: string
          description: Where the component enters the review flow; defaults to draft
          enum: [draft, ai_generated]
      additionalProperties: false

    ComponentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 60 }
        language: { type: string, minLength: 2, maxLength: 10 }
      additionalProperties: false

    ContentStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ContentStatus' }
      additionalProperties: false

    ComponentUsage:
      type: object
      description: |
        What depends on a component. `locked_assignments` is the count that matters:
        while it is above zero the body is frozen, because those emails have gone out.
      required: [variants, campaigns, locked_assignments]
      properties:
        variants:
          type: array
          items: { $ref: '#/components/schemas/EmailVariant' }
        campaigns:
          type: array
          items: { $ref: '#/components/schemas/CampaignSummary' }
        locked_assignments: { type: integer, format: int64 }

    EmailVariant:
      type: object
      required: [id, name, step, status, subject_template, body_template, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        step: { type: integer, minimum: 1, maximum: 5 }
        status: { $ref: '#/components/schemas/ContentStatus' }
        subject_template: { type: string }
        body_template: { type: string }
        component_ids:
          type: array
          items: { type: string, format: uuid }
        ai_generation_id: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }

    EmailVariantComponent:
      allOf:
        - $ref: '#/components/schemas/EmailComponent'
        - type: object
          required: [position, slot]
          properties:
            position: { type: integer }
            slot: { $ref: '#/components/schemas/ComponentType' }

    EmailVariantDetail:
      allOf:
        - $ref: '#/components/schemas/EmailVariant'
        - type: object
          required: [components, campaigns]
          properties:
            components:
              type: array
              description: The slots this variant is assembled from, in assembly order
              items: { $ref: '#/components/schemas/EmailVariantComponent' }
            campaigns:
              type: array
              items: { $ref: '#/components/schemas/CampaignSummary' }

    EmailVariantList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EmailVariant' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    VariantSlot:
      type: object
      required: [slot, component_id]
      properties:
        slot: { $ref: '#/components/schemas/ComponentType' }
        component_id: { type: string, format: uuid }
      additionalProperties: false

    VariantCreate:
      type: object
      required: [name, components]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        step: { type: integer, minimum: 1, maximum: 5 }
        components:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/VariantSlot' }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    VariantUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        step: { type: integer, minimum: 1, maximum: 5 }
        components:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/VariantSlot' }
        notes: { type: string, maxLength: 2000, nullable: true }
      additionalProperties: false

    VariantPreviewRequest:
      type: object
      properties:
        contact_id:
          type: string
          format: uuid
          description: Render against this contact's real merge fields; omit for samples
      additionalProperties: false

    ComponentPreviewRequest:
      type: object
      required: [components]
      properties:
        components:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/VariantSlot' }
        contact_id: { type: string, format: uuid }
      additionalProperties: false

    EmailPreview:
      type: object
      required: [subject, body_text, body_html, placeholders]
      properties:
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
        placeholders:
          type: array
          description: Every merge field the rendered email referenced
          items: { type: string }

    AIProvider:
      type: object
      required: [provider, mode, label]
      properties:
        provider: { $ref: '#/components/schemas/AIProviderName' }
        mode: { $ref: '#/components/schemas/AIMode' }
        model: { type: string, nullable: true, description: Null for the manual provider }
        label: { type: string, example: ChatGPT (manual) }
        chatgpt:
          allOf: [{ $ref: '#/components/schemas/ChatGPTConnection' }]
          nullable: true
          description: |
            Sign in with ChatGPT. Null when `KARVON_CHATGPT_CLIENT_ID` is not set. While
            connected, `provider` is `chatgpt_plan` and `mode` is `api`.

    AIBrief:
      type: object
      description: Everything the generator is told about the campaign.
      properties:
        campaign_goal: { type: string, maxLength: 2000 }
        company: { type: string, maxLength: 200 }
        product: { type: string, maxLength: 500 }
        target_industry: { type: string, maxLength: 200 }
        target_job_title: { type: string, maxLength: 200 }
        target_company_size: { type: string, maxLength: 100 }
        pain_points:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        value_proposition: { type: string, maxLength: 2000 }
        desired_cta: { type: string, maxLength: 500 }
        tone: { type: string, maxLength: 100 }
        language: { type: string, maxLength: 10 }
        additional_context: { type: string, maxLength: 4000 }
        subject_count: { type: integer, minimum: 0, maximum: 50, description: Zero means the default }
        hook_count: { type: integer, minimum: 0, maximum: 50 }
        body_count: { type: integer, minimum: 0, maximum: 50 }
        cta_count: { type: integer, minimum: 0, maximum: 50 }
        variant_count: { type: integer, minimum: 0, maximum: 50 }
      additionalProperties: false

    AIOutputComponent:
      type: object
      required: [type, name, body]
      properties:
        type: { $ref: '#/components/schemas/ComponentType' }
        name: { type: string }
        body: { type: string }
        tags:
          type: array
          items: { type: string }

    AIOutputVariant:
      type: object
      description: |
        A variant the model proposed, pointing at `components` by index. Only the
        subject is required; a slot the model left out is null.
      required: [name, subject]
      properties:
        name: { type: string }
        subject: { type: integer }
        hook: { type: integer, nullable: true }
        problem: { type: integer, nullable: true }
        value_prop: { type: integer, nullable: true }
        proof: { type: integer, nullable: true }
        cta: { type: integer, nullable: true }
        closing: { type: integer, nullable: true }
        ps: { type: integer, nullable: true }

    AIOutput:
      type: object
      required: [components, variants]
      properties:
        components:
          type: array
          items: { $ref: '#/components/schemas/AIOutputComponent' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/AIOutputVariant' }
        warnings:
          type: array
          description: Non-fatal problems found while parsing, such as a variant dropped for a bad index
          items: { type: string }

    AIGeneration:
      type: object
      required: [id, provider, status, brief, prompt, prompt_version,
                 component_count, variant_count, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/AIProviderName' }
        model: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/GenerationStatus' }
        campaign_id: { type: string, format: uuid, nullable: true }
        brief: { $ref: '#/components/schemas/AIBrief' }
        prompt: { type: string, description: The block the operator pastes into ChatGPT }
        prompt_version:
          type: string
          example: 2026-09-v1
          description: Stamped on every generation so a later prompt change is visible in the analytics
        component_count: { type: integer }
        variant_count: { type: integer }
        parsed:
          allOf:
            - $ref: '#/components/schemas/AIOutput'
          nullable: true
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        parsed_at: { type: string, format: date-time, nullable: true }
        imported_at: { type: string, format: date-time, nullable: true }

    AIGenerationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AIGeneration' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    AIGenerationCreate:
      type: object
      required: [brief]
      properties:
        brief: { $ref: '#/components/schemas/AIBrief' }
        campaign_id: { type: string, format: uuid }
        manual:
          type: boolean
          default: false
          description: |
            Build the prompt for copy-and-paste even when a provider could generate
            directly. The way out when the ChatGPT plan's cap is used up
            (`ai_plan_limit`); never falls through to a billed API key.
      additionalProperties: false

    AIParseRequest:
      type: object
      required: [raw_output]
      properties:
        raw_output:
          type: string
          minLength: 1
          maxLength: 200000
          description: The JSON pasted back from the model, exactly as it was given
      additionalProperties: false

    AIImportRequest:
      type: object
      description: Omitting both index lists imports everything the generation parsed.
      properties:
        component_indexes:
          type: array
          maxItems: 200
          items: { type: integer, minimum: 0 }
        variant_indexes:
          type: array
          maxItems: 200
          items: { type: integer, minimum: 0 }
        attach_to_campaign_id: { type: string, format: uuid }
      additionalProperties: false

    AIImportResult:
      type: object
      required: [components, variants]
      properties:
        components:
          type: array
          items: { $ref: '#/components/schemas/EmailComponent' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/EmailVariant' }

    SendingAccount:
      type: object
      description: |
        A mailbox Instantly sends from. The stat fields are present when the account is
        read through the sending-accounts endpoints and absent when it is nested in a
        campaign's response.
      required: [id, email, status, setup_pending, is_managed, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        provider_code: { type: integer, nullable: true }
        status: { type: integer, description: Instantly's numeric account status }
        warmup_status: { type: integer, nullable: true }
        daily_limit: { type: integer, nullable: true }
        sending_gap: { type: integer, nullable: true }
        warmup_score: { type: integer, nullable: true }
        status_message: { type: string, nullable: true }
        tracking_domain: { type: string, nullable: true }
        tracking_domain_status: { type: string, nullable: true }
        setup_pending: { type: boolean }
        is_managed: { type: boolean }
        last_synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sent_30d: { type: integer, format: int64 }
        bounced_30d: { type: integer, format: int64 }
        replies_30d: { type: integer, format: int64 }
        campaigns: { type: integer, format: int64 }
        last_activity_at: { type: string, format: date-time, nullable: true }
        local_sends: { type: integer, format: int64 }
        local_bounces: { type: integer, format: int64 }
        local_replies: { type: integer, format: int64 }

    SendingAccountDaily:
      type: object
      required: [sending_account_id, day, sent, bounced, contacted, new_leads_contacted,
                 opened, unique_opened, replies, unique_replies, clicks, unique_clicks, fetched_at]
      properties:
        sending_account_id: { type: string, format: uuid }
        day: { type: string, format: date }
        sent: { type: integer }
        bounced: { type: integer }
        contacted: { type: integer }
        new_leads_contacted: { type: integer }
        opened: { type: integer }
        unique_opened: { type: integer }
        replies: { type: integer }
        unique_replies: { type: integer }
        clicks: { type: integer }
        unique_clicks: { type: integer }
        fetched_at: { type: string, format: date-time }

    SendingAccountDetail:
      type: object
      required: [account, daily, campaigns]
      properties:
        account: { $ref: '#/components/schemas/SendingAccount' }
        daily:
          type: array
          items: { $ref: '#/components/schemas/SendingAccountDaily' }
        campaigns:
          type: array
          items: { $ref: '#/components/schemas/CampaignSummary' }

    VariantAssignment:
      type: object
      description: |
        The variant one lead was given for one step, with the email as it was rendered.
        Once `locked_at` is set the text is frozen: it is what actually left the
        mailbox, so no later edit to a component or weight may rewrite it.
      required: [id, campaign_lead_id, step, variant_id, weights_version, seed_hash,
                 rendered_subject, rendered_body, assigned_at]
      properties:
        id: { type: string, format: uuid }
        campaign_lead_id: { type: string, format: uuid }
        step: { type: integer, minimum: 1, maximum: 5 }
        variant_id: { type: string, format: uuid }
        weights_version: { type: integer }
        seed_hash:
          type: string
          description: The deterministic draw behind this assignment, so it can be reproduced
        rendered_subject: { type: string }
        rendered_body: { type: string }
        component_ids:
          type: array
          items: { type: string, format: uuid }
        subject_component_id: { type: string, format: uuid, nullable: true }
        hook_component_id: { type: string, format: uuid, nullable: true }
        cta_component_id: { type: string, format: uuid, nullable: true }
        assigned_at: { type: string, format: date-time }
        locked_at: { type: string, format: date-time, nullable: true }

    EmailSend:
      type: object
      required: [id, campaign_lead_id, campaign_id, contact_id, step, open_count,
                 click_count, sent_at, source, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        campaign_lead_id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid, nullable: true }
        campaign_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        step: { type: integer, minimum: 1, maximum: 5 }
        variant_id: { type: string, format: uuid, nullable: true }
        sending_account_email: { type: string, nullable: true }
        sending_account_id: { type: string, format: uuid, nullable: true }
        instantly_email_id: { type: string, nullable: true }
        provider_message_id: { type: string, nullable: true }
        subject_snapshot: { type: string, nullable: true }
        sent_at: { type: string, format: date-time }
        first_opened_at: { type: string, format: date-time, nullable: true }
        last_opened_at: { type: string, format: date-time, nullable: true }
        open_count: { type: integer }
        first_clicked_at: { type: string, format: date-time, nullable: true }
        last_clicked_at: { type: string, format: date-time, nullable: true }
        click_count: { type: integer }
        replied_at: { type: string, format: date-time, nullable: true }
        reply_classification:
          allOf:
            - $ref: '#/components/schemas/ReplyClassification'
          nullable: true
        bounced_at: { type: string, format: date-time, nullable: true }
        unsubscribed_at: { type: string, format: date-time, nullable: true }
        source: { $ref: '#/components/schemas/SendSource' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContactEvent:
      type: object
      required: [id, contact_id, type, occurred_at, source, created_at]
      properties:
        id: { type: integer, format: int64 }
        contact_id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid, nullable: true }
        campaign_lead_id: { type: string, format: uuid, nullable: true }
        assignment_id: { type: string, format: uuid, nullable: true }
        variant_id: { type: string, format: uuid, nullable: true }
        send_id: { type: string, format: uuid, nullable: true }
        step: { type: integer, nullable: true }
        type: { $ref: '#/components/schemas/ContactEventType' }
        occurred_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/ContactEventSource' }
        provider_event_id: { type: string, format: uuid, nullable: true }
        stage_before:
          allOf:
            - $ref: '#/components/schemas/ContactStage'
          nullable: true
        stage_after:
          allOf:
            - $ref: '#/components/schemas/ContactStage'
          nullable: true
        data:
          type: object
          additionalProperties: true
          nullable: true
        created_at: { type: string, format: date-time }

    ContactEventList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ContactEvent' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    NewsletterAudience:
      type: object
      description: |
        A Mailchimp audience. `webhook_token` and the signing secret are never
        returned; `webhook_url` already carries what the client needs to show.
      required: [id, mailchimp_list_id, name, double_optin, allow_single_opt_in,
                 default_tags, is_default, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        mailchimp_list_id: { type: string }
        name: { type: string }
        double_optin: { type: boolean, description: What Mailchimp itself has configured }
        allow_single_opt_in:
          type: boolean
          description: |
            Whether a push may ask for `subscribed` directly. Off means every contact
            still confirms by email, whatever consent we hold.
        default_tags:
          type: array
          items: { type: string }
        webhook_id: { type: string, nullable: true }
        webhook_url: { type: string, nullable: true }
        member_count: { type: integer, nullable: true }
        stats:
          type: object
          additionalProperties: true
          nullable: true
        is_default: { type: boolean }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NewsletterAudienceUpdate:
      type: object
      properties:
        allow_single_opt_in: { type: boolean }
        default_tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 60 }
        is_default: { type: boolean }
      additionalProperties: false

    ConsentDecision:
      type: object
      description: |
        The consent gate's verdict for one contact. `reason` is the machine code and
        `explanation` the sentence to show; both are returned so the UI never re-derives
        the rule.
      required: [eligible, requested_status, reason, explanation]
      properties:
        eligible: { type: boolean }
        requested_status: { $ref: '#/components/schemas/RequestedSubscriptionStatus' }
        reason:
          type: string
          description: Empty when eligible
          example: no_consent
        explanation: { type: string }

    EligibleContactRecord:
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          properties:
            consent_id: { type: string, format: uuid, nullable: true }
            consent_source:
              allOf:
                - $ref: '#/components/schemas/ConsentSource'
              nullable: true
            consent_captured_at: { type: string, format: date-time, nullable: true }

    EligibleContact:
      type: object
      required: [contact, decision]
      properties:
        contact: { $ref: '#/components/schemas/EligibleContactRecord' }
        decision: { $ref: '#/components/schemas/ConsentDecision' }

    EligibleContactList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EligibleContact' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    NewsletterPushRequest:
      type: object
      required: [contact_ids]
      properties:
        contact_ids:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: string, format: uuid }
        audience_id:
          type: string
          format: uuid
          description: Defaults to the audience flagged as default
      additionalProperties: false

    NewsletterPushRejection:
      type: object
      required: [contact_id, reason]
      properties:
        contact_id: { type: string, format: uuid }
        reason: { type: string, example: no_consent }

    NewsletterPushResult:
      type: object
      description: |
        The gate is applied per contact, not to the request: what passes is queued and
        what does not comes back with its reason, rather than failing the whole push.
      required: [queued, rejected]
      properties:
        queued:
          type: array
          items: { type: string, format: uuid }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/NewsletterPushRejection' }

    NewsletterSubscription:
      type: object
      required: [id, contact_id, audience_id, requested_status, status, sync_status,
                 sync_attempts, tags, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        audience_id: { type: string, format: uuid }
        consent_id: { type: string, format: uuid, nullable: true }
        requested_status: { $ref: '#/components/schemas/RequestedSubscriptionStatus' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        sync_status: { $ref: '#/components/schemas/SyncStatus' }
        subscriber_hash: { type: string, nullable: true }
        unique_email_id: { type: string, nullable: true }
        mailchimp_contact_id: { type: string, nullable: true }
        web_id: { type: integer, format: int64, nullable: true }
        claimed_at: { type: string, format: date-time, nullable: true }
        pushed_at: { type: string, format: date-time, nullable: true }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        sync_attempts: { type: integer }
        subscribed_at: { type: string, format: date-time, nullable: true }
        unsubscribed_at: { type: string, format: date-time, nullable: true }
        unsubscribe_reason: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NewsletterSubscriptionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NewsletterSubscription' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    NewsletterStats:
      type: object
      required: [by_status, eligible, subscribed, pending, conversion_rate]
      properties:
        by_status: { $ref: '#/components/schemas/CountsByKey' }
        eligible: { type: integer, format: int64 }
        subscribed: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        conversion_rate:
          type: number
          format: double
          description: Subscribers over eligible contacts

    WebhookStatus:
      type: object
      required: [registered, url, provider_id]
      properties:
        registered: { type: boolean }
        url: { type: string, description: Where the provider posts; empty when unregistered }
        provider_id: { type: string, description: The provider's own id for the registration }
        status: { type: integer, nullable: true }
        error: { type: string, nullable: true }

    WebhookRegisterRequest:
      type: object
      properties:
        rotate:
          type: boolean
          default: false
          description: |
            Replace the token and signing secret. The previous URL stops working the
            moment this succeeds, so deliveries in flight against it are lost.
      additionalProperties: false

    WebhookAck:
      type: object
      description: |
        What a provider delivery is acknowledged with. A `duplicate` is accepted rather
        than refused: providers retry, and an event that was already stored must not
        be applied twice.
      required: [event_id, duplicate, stored]
      properties:
        event_id: { type: string, format: uuid }
        duplicate: { type: boolean }
        stored: { type: boolean }

    EventSummary:
      type: object
      required: [total, unprocessed, errored]
      properties:
        total: { type: integer, format: int64 }
        unprocessed: { type: integer, format: int64 }
        errored: { type: integer, format: int64 }
        last_received_at: { type: string, format: date-time, nullable: true }

    ProviderStatus:
      type: object
      required: [source_id, has_key, enabled, webhook, events]
      properties:
        source_id: { type: string, format: uuid }
        has_key: { type: boolean, description: Whether a key is stored; the key itself is never returned }
        enabled: { type: boolean }
        last_tested_at: { type: string, format: date-time, nullable: true }
        last_test_ok: { type: boolean, nullable: true }
        webhook: { $ref: '#/components/schemas/WebhookStatus' }
        events: { $ref: '#/components/schemas/EventSummary' }
        last_sync:
          allOf:
            - $ref: '#/components/schemas/SyncRun'
          nullable: true

    Integrations:
      type: object
      required: [public_base_url, instantly, mailchimp, audiences, ai]
      properties:
        public_base_url:
          type: string
          description: |
            Where providers can reach this API. Empty means no webhook can be
            registered and reconciliation carries the whole load.
        instantly: { $ref: '#/components/schemas/ProviderStatus' }
        mailchimp: { $ref: '#/components/schemas/ProviderStatus' }
        audiences: { type: integer, description: How many Mailchimp audiences are known }
        ai: { $ref: '#/components/schemas/AIProvider' }

    ProviderTestResult:
      type: object
      required: [ok, detail]
      properties:
        ok: { type: boolean }
        detail: { type: string, description: What the provider answered, or why it did not }
        accounts_count: { type: integer, description: Sending accounts seen; Instantly only }

    ProviderEvent:
      type: object
      description: |
        One delivery as it arrived, kept verbatim. `dedupe_key` is what makes a retry
        harmless: a second delivery with the same key is acknowledged and dropped.
      required: [id, provider, event_type, dedupe_key, received_at, source, attempts]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/ProviderName' }
        event_type: { type: string, example: reply_received }
        dedupe_key: { type: string }
        received_at: { type: string, format: date-time }
        occurred_at: { type: string, format: date-time, nullable: true }
        raw:
          type: object
          additionalProperties: true
          nullable: true
        source: { $ref: '#/components/schemas/ProviderEventSource' }
        campaign_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        campaign_lead_id: { type: string, format: uuid, nullable: true }
        processed_at: { type: string, format: date-time, nullable: true }
        attempts: { type: integer }
        error: { type: string, nullable: true }

    ProviderEventList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProviderEvent' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    SyncRun:
      type: object
      required: [id, kind, status, started_at, items_seen, items_updated]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SyncRunKind' }
        status: { $ref: '#/components/schemas/SyncRunStatus' }
        target_id: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        items_seen: { type: integer }
        items_updated: { type: integer }
        error: { type: string, nullable: true }
        details:
          type: object
          additionalProperties: true
          nullable: true

    LaunchRequest:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: When to launch, in the future and within a year. Null or absent launches now.
      additionalProperties: false

    InstantlyCleanupScope:
      type: string
      description: |
        `finished` deletes only leads Instantly will not email again: the sequence
        completed, the lead bounced or unsubscribed, Karvon stopped it, or its
        campaign completed or was archived. `emailed` deletes every lead emailed at
        least once, which also cancels the follow-up steps it has not had yet.
      enum: [finished, emailed]

    InstantlyCleanupPolicy:
      type: object
      required: [scope, min_idle_days, include_replied]
      properties:
        scope: { $ref: '#/components/schemas/InstantlyCleanupScope' }
        min_idle_days:
          type: integer
          minimum: 0
          maximum: 90
          description: |
            Keeps leads whose last send or reply is newer than this many days, so a
            reply to a recent email still finds its lead at Instantly.
        include_replied:
          type: boolean
          description: |
            Also deletes leads that replied. Leads marked interested, meeting booked,
            meeting completed or won are always kept.

    InstantlyCleanupSettings:
      allOf:
        - $ref: '#/components/schemas/InstantlyCleanupPolicy'
        - type: object
          required: [auto_enabled]
          properties:
            auto_enabled:
              type: boolean
              description: Runs the saved policy on its own every few hours
            contact_limit:
              type: integer
              minimum: 1
              nullable: true
              description: |
                The Instantly plan's uploaded-contacts cap (1,000 on Growth). Enables
                the capacity figures and the non-blocking `instantly_capacity` launch
                checklist item.

    InstantlyCapacity:
      type: object
      description: |
        An estimate: Instantly has no endpoint for the figure. Karvon's own leads are
        counted exactly; campaigns started in Instantly add their lead count from the
        latest sync.
      required: [in_use, karvon_leads, imported_leads, pending_leads]
      properties:
        limit: { type: integer, nullable: true }
        in_use:
          type: integer
          format: int64
          description: karvon_leads + imported_leads
        available:
          type: integer
          format: int64
          nullable: true
          description: limit - in_use; null when the limit is unknown, negative when over
        karvon_leads:
          type: integer
          format: int64
          description: Leads Karvon pushed that are still in an Instantly campaign
        imported_leads:
          type: integer
          format: int64
          description: Leads of campaigns started in Instantly's own app
        pending_leads:
          type: integer
          format: int64
          description: Leads queued to be pushed by ready, scheduled or live campaigns

    InstantlyCleanupCampaign:
      type: object
      required: [campaign, in_instantly, eligible]
      properties:
        campaign: { $ref: '#/components/schemas/CampaignSummary' }
        in_instantly:
          type: integer
          format: int64
          description: Leads of this campaign still at Instantly
        eligible:
          type: integer
          format: int64
          description: How many of them the cleanup would delete
        last_contacted_at: { type: string, format: date-time, nullable: true }

    InstantlyCleanupPreview:
      type: object
      required: [eligible, campaigns, capacity]
      properties:
        eligible:
          type: integer
          format: int64
          description: Leads the cleanup would delete, capped by max_leads
        campaigns:
          type: array
          description: Every Karvon campaign with leads still at Instantly, most eligible first
          items: { $ref: '#/components/schemas/InstantlyCleanupCampaign' }
        capacity: { $ref: '#/components/schemas/InstantlyCapacity' }

    InstantlyCleanupRequest:
      allOf:
        - $ref: '#/components/schemas/InstantlyCleanupPolicy'
        - type: object
          properties:
            campaign_ids:
              type: array
              maxItems: 500
              description: Empty or absent means every Karvon campaign
              items: { type: string, format: uuid }
            max_leads:
              type: integer
              minimum: 1
              nullable: true
              description: Stop after this many; absent deletes everything that matches

    InstantlyCleanupRunStatus:
      type: string
      enum: [queued, running, done, failed]

    InstantlyCleanupRun:
      type: object
      required: [id, trigger, status, scope, min_idle_days, include_replied, campaign_ids,
                 selected, removed, already_gone, failed, created_at]
      properties:
        id: { type: string, format: uuid }
        trigger:
          type: string
          enum: [manual, auto]
        status: { $ref: '#/components/schemas/InstantlyCleanupRunStatus' }
        scope: { $ref: '#/components/schemas/InstantlyCleanupScope' }
        min_idle_days: { type: integer }
        include_replied: { type: boolean }
        campaign_ids:
          type: array
          items: { type: string, format: uuid }
        max_leads: { type: integer, nullable: true }
        selected:
          type: integer
          description: Leads matching when the run started; the denominator for progress
        removed:
          type: integer
          description: Deleted from Instantly by this run
        already_gone:
          type: integer
          description: Instantly no longer had them; stamped as removed all the same
        failed:
          type: integer
          description: Instantly refused to delete them; they stay and the run moved on
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    InstantlyCleanupRunList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InstantlyCleanupRun' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    InstantlyCleanupOverview:
      type: object
      required: [settings, capacity, eligible_now]
      properties:
        settings: { $ref: '#/components/schemas/InstantlyCleanupSettings' }
        capacity: { $ref: '#/components/schemas/InstantlyCapacity' }
        eligible_now:
          type: integer
          format: int64
          description: What the saved policy would delete right now
        active_run:
          allOf:
            - $ref: '#/components/schemas/InstantlyCleanupRun'
          nullable: true
        last_run:
          allOf:
            - $ref: '#/components/schemas/InstantlyCleanupRun'
          nullable: true

    SyncRunList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SyncRun' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    FunnelStep:
      type: object
      description: |
        One bar of the cold → subscriber funnel. `current` is who sits in the stage
        now, `ever_reached` who has passed through it; read the second as the
        conversion, because a contact only moves forward.
      required: [stage, label, current, ever_reached]
      properties:
        stage: { $ref: '#/components/schemas/ContactStage' }
        label: { type: string, example: Newsletter eligible }
        current: { type: integer, format: int64 }
        ever_reached: { type: integer, format: int64 }

    CampaignOverview:
      type: object
      required: [campaigns, contacts_by_stage, local, instantly, interested, newsletter_eligible,
                 subscribers, conversion_rate, funnel]
      properties:
        campaigns: { $ref: '#/components/schemas/CountsByKey' }
        contacts_by_stage: { $ref: '#/components/schemas/CountsByKey' }
        local: { $ref: '#/components/schemas/Metrics' }
        instantly: { $ref: '#/components/schemas/ImportedTotals' }
        interested:
          type: integer
          format: int64
          description: |
            Contacts that ever reached the interested stage, counted from our own
            events. Campaigns started in Instantly are not in it; their figure is
            `instantly.interested`.
        newsletter_eligible: { type: integer, format: int64 }
        subscribers: { type: integer, format: int64 }
        conversion_rate:
          type: number
          format: double
          description: |
            Subscribers over contacts ever contacted: the whole cold → subscriber
            conversion, not only its eligible tail.
        funnel:
          type: array
          items: { $ref: '#/components/schemas/FunnelStep' }

    ImportedTotals:
      type: object
      description: |
        Instantly's own figures summed over the campaigns started in Instantly's app
        (`source: instantly`), from each one's latest analytics snapshot. Those
        campaigns send nothing through Karvon, so they have no local sends, leads or
        events; this is kept beside `local`, never merged into it. `interested` is
        Instantly's opportunity count, and `metrics.positive_replies` carries the same
        number, Instantly having no reply classification of its own.
      required: [campaigns, metrics, interested]
      properties:
        campaigns: { type: integer, format: int64, description: Imported campaigns counted. }
        metrics: { $ref: '#/components/schemas/Metrics' }
        interested: { type: integer, format: int64 }

    Mismatch:
      type: object
      description: A metric where our count and Instantly's disagree beyond tolerance.
      required: [metric, local, instantly]
      properties:
        metric: { type: string, example: replied }
        local: { type: integer, format: int64 }
        instantly: { type: integer, format: int64 }

    DailyPoint:
      type: object
      required: [day, sends, opened, clicked, replied, bounced]
      properties:
        day: { type: string, format: date }
        sends: { type: integer, format: int64 }
        opened: { type: integer, format: int64 }
        clicked: { type: integer, format: int64 }
        replied: { type: integer, format: int64 }
        bounced: { type: integer, format: int64 }

    CampaignAnalytics:
      type: object
      description: |
        Our numbers and Instantly's side by side. They are never merged: the two count
        differently, and the gap is itself a signal, which `mismatch` reports rather
        than averages away.
      required: [local, mismatch, daily, funnel, interested, eligible, subscribers,
                 conversion_rate, lead_counts]
      properties:
        local: { $ref: '#/components/schemas/Metrics' }
        instantly:
          type: object
          additionalProperties: true
          nullable: true
          description: Instantly's own figures, unchanged; null when they could not be fetched
        mismatch:
          type: array
          items: { $ref: '#/components/schemas/Mismatch' }
          description: |
            Metrics where our count and Instantly's disagree beyond tolerance. Always
            empty for a campaign with `source` `instantly`: it sends nothing through
            Karvon, so there is no local count to compare.
        daily:
          type: array
          items: { $ref: '#/components/schemas/DailyPoint' }
        funnel:
          type: array
          items: { $ref: '#/components/schemas/FunnelStep' }
        interested: { type: integer, format: int64 }
        eligible: { type: integer, format: int64 }
        subscribers: { type: integer, format: int64 }
        conversion_rate:
          type: number
          format: double
          description: |
            Subscribers over contacts ever contacted: the whole cold → subscriber
            conversion, not only its eligible tail.
        lead_counts: { $ref: '#/components/schemas/CountsByKey' }

    VariantAnalytics:
      allOf:
        - $ref: '#/components/schemas/Metrics'
        - type: object
          required: [variant_id, variant_name, step, assigned]
          properties:
            variant_id: { type: string, format: uuid }
            variant_name: { type: string }
            step: { type: integer, minimum: 1, maximum: 5 }
            assigned: { type: integer, format: int64 }

    ComponentAnalytics:
      allOf:
        - $ref: '#/components/schemas/Metrics'
        - type: object
          required: [component_id, type, name]
          properties:
            component_id: { type: string, format: uuid }
            type: { $ref: '#/components/schemas/ComponentType' }
            name: { type: string }

    AccountAnalytics:
      type: object
      required: [email, local, instantly_sent, instantly_bounced, instantly_replies,
                 instantly_bounce_rate]
      properties:
        sending_account_id: { type: string, format: uuid, nullable: true }
        email: { type: string }
        local: { $ref: '#/components/schemas/Metrics' }
        instantly_sent: { type: integer, format: int64 }
        instantly_bounced: { type: integer, format: int64 }
        instantly_replies: { type: integer, format: int64 }
        instantly_bounce_rate: { type: number, format: double }

    DomainSettings:
      type: object
      required: [source_id, account_id, has_token, enabled, ready, max_domains_per_purchase, max_check_domains]
      properties:
        source_id:
          type: string
          format: uuid
          description: The sources row holding the token (kind `cloudflare`, role `registrar`)
        account_id: { type: string, nullable: true, description: The 32-character Cloudflare account ID }
        has_token: { type: boolean, description: Whether an API token is stored; the token itself is never returned }
        enabled: { type: boolean }
        ready:
          type: boolean
          description: Account ID and token are set and the connection is enabled; search and purchase need this
        last_tested_at: { type: string, format: date-time, nullable: true }
        last_test_ok: { type: boolean, nullable: true }
        max_domains_per_purchase: { type: integer, example: 10, description: Hard limit on one purchase }
        max_check_domains: { type: integer, example: 20, description: Most names one check accepts }

    DomainSettingsUpdate:
      type: object
      properties:
        account_id:
          type: string
          nullable: true
          maxLength: 64
          description: Omit to keep, null to clear
        api_token:
          type: string
          nullable: true
          maxLength: 500
          description: Plaintext Cloudflare API token; stored AES-GCM encrypted. Omit to keep, null to clear.
        enabled: { type: boolean }
      additionalProperties: false

    DomainConnectionTest:
      type: object
      required: [ok, tested_at]
      properties:
        ok: { type: boolean }
        tested_at: { type: string, format: date-time }

    DomainPricing:
      type: object
      description: |
        Prices as Cloudflare wrote them (decimal strings in the currency's major unit)
        and in cents, which is what totals and `expected_cost_cents` use.
      required: [currency, registration_cost, renewal_cost, registration_cost_cents, renewal_cost_cents]
      properties:
        currency: { type: string, example: USD }
        registration_cost: { type: string, example: '10.11', description: First-year registration cost }
        renewal_cost: { type: string, example: '10.11', description: Per-year renewal cost }
        registration_cost_cents: { type: integer, format: int64, example: 1011 }
        renewal_cost_cents: { type: integer, format: int64, example: 1011 }

    DomainOffer:
      type: object
      required: [name, registrable, purchasable]
      properties:
        name: { type: string, description: The domain in punycode, e.g. example.com }
        registrable: { type: boolean, description: What Cloudflare answered }
        purchasable:
          type: boolean
          description: Can be added to a purchase — registrable, standard tier and priced
        tier: { type: string, nullable: true, description: '`standard` or `premium`; premium cannot be bought through the API' }
        reason:
          type: string
          nullable: true
          description: |
            Why it cannot be registered: domain_unavailable, domain_premium,
            extension_not_supported_via_api, extension_not_supported,
            extension_disallows_registration, not_returned
        pricing:
          allOf:
            - $ref: '#/components/schemas/DomainPricing'
          nullable: true

    DomainOfferList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DomainOffer' }

    DomainCheckRequest:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 253 }
      additionalProperties: false

    DomainPurchaseLine:
      type: object
      required: [name, expected_cost_cents]
      properties:
        name: { type: string, minLength: 1, maxLength: 253 }
        expected_cost_cents:
          type: integer
          format: int64
          minimum: 0
          description: The registration price shown to the operator; nothing is bought above it
      additionalProperties: false

    DomainPurchaseCreate:
      type: object
      required: [domains, confirm]
      properties:
        domains:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/DomainPurchaseLine' }
        auto_renew:
          type: boolean
          default: false
          description: Turn automatic renewal on for every domain bought
        confirm:
          type: boolean
          description: Must be true; the request is refused otherwise
      additionalProperties: false

    DomainPurchaseStatus:
      type: string
      description: |
        queued and processing are in flight (only one purchase can be at a time);
        succeeded, partial and failed are final.
      enum: [queued, processing, succeeded, partial, failed]

    DomainPurchaseItemStatus:
      type: string
      description: |
        pending — not yet sent; registering — sent, outcome being confirmed with
        Cloudflare; succeeded — registered and billed; failed — not registered;
        action_required — finish it in the Cloudflare dashboard.
      enum: [pending, registering, succeeded, failed, action_required]

    DomainPurchaseItem:
      type: object
      required: [id, domain_name, position, status, quoted_cost_cents, register_attempts, updated_at]
      properties:
        id: { type: string, format: uuid }
        domain_name: { type: string }
        position: { type: integer, minimum: 0, maximum: 9 }
        status: { $ref: '#/components/schemas/DomainPurchaseItemStatus' }
        quoted_cost_cents: { type: integer, format: int64, description: The confirmed price }
        cost_cents:
          type: integer
          format: int64
          nullable: true
          description: The price Cloudflare quoted right before registering
        renewal_cost_cents: { type: integer, format: int64, nullable: true }
        register_attempts: { type: integer }
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        registered_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    DomainPurchase:
      type: object
      required: [id, status, auto_renew, currency, item_count, quoted_total_cents, charged_total_cents,
                 succeeded_count, failed_count, action_required_count, in_flight_count, created_at, items]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DomainPurchaseStatus' }
        auto_renew: { type: boolean }
        currency: { type: string }
        item_count: { type: integer, minimum: 1, maximum: 10 }
        quoted_total_cents: { type: integer, format: int64, description: Sum of the confirmed prices }
        charged_total_cents: { type: integer, format: int64, description: Sum of the prices of the domains registered }
        succeeded_count: { type: integer }
        failed_count: { type: integer }
        action_required_count: { type: integer }
        in_flight_count: { type: integer, description: Domains pending or registering }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/DomainPurchaseItem' }

    DomainPurchaseList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DomainPurchase' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    DomainRegistration:
      type: object
      required: [domain_name, status, auto_renew, locked, privacy_mode]
      properties:
        domain_name: { type: string }
        status:
          type: string
          description: |
            active, registration_pending, transfer_pending, expired, suspended,
            redemption_period or pending_delete
        created_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        auto_renew: { type: boolean }
        locked: { type: boolean }
        privacy_mode: { type: string, description: '`redaction` or `off`' }

    DomainRegistrationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DomainRegistration' }

    DomainRegistrationUpdate:
      type: object
      required: [auto_renew]
      properties:
        auto_renew: { type: boolean }
      additionalProperties: false

    WorkspaceSettings:
      type: object
      required: [source_id, admin_email, service_account_email, service_account_client_id, has_key, enabled,
                 ready, scopes, max_mailboxes_per_domain]
      properties:
        source_id:
          type: string
          format: uuid
          description: The sources row holding the key (kind `google_workspace`, role `mailboxes`)
        admin_email: { type: string, nullable: true, description: The super admin the service account acts as }
        service_account_email: { type: string, nullable: true, description: From the stored key }
        service_account_client_id:
          type: string
          nullable: true
          description: From the stored key; the Client ID to enter for domain-wide delegation
        has_key: { type: boolean, description: Whether a key is stored; the key itself is never returned }
        enabled: { type: boolean }
        ready:
          type: boolean
          description: Admin email and key are set and the connection is enabled; setups need this
        last_tested_at: { type: string, format: date-time, nullable: true }
        last_test_ok: { type: boolean, nullable: true }
        scopes:
          type: array
          items: { type: string }
          description: The OAuth scopes to delegate to the service account
        max_mailboxes_per_domain: { type: integer, example: 5, description: Hard limit on one domain }

    WorkspaceSettingsUpdate:
      type: object
      properties:
        admin_email:
          type: string
          nullable: true
          maxLength: 254
          description: Omit to keep, null to clear
        service_account_key:
          type: string
          nullable: true
          maxLength: 10000
          description: |
            The service-account JSON key file's contents; stored AES-GCM encrypted.
            Omit to keep, null to clear.
        enabled: { type: boolean }
      additionalProperties: false

    WorkspaceConnectionTest:
      type: object
      required: [ok, tested_at, domain_count]
      properties:
        ok: { type: boolean }
        tested_at: { type: string, format: date-time }
        primary_domain: { type: string, nullable: true, description: The Workspace account's primary domain }
        domain_count: { type: integer, description: Domains in the Workspace account, primary included }

    WorkspaceMailboxInput:
      type: object
      required: [local_part, given_name, family_name]
      properties:
        local_part:
          type: string
          minLength: 1
          maxLength: 64
          description: The part before the @; letters, digits, dots, dashes, underscores
          example: jane
        given_name: { type: string, minLength: 1, maxLength: 60 }
        family_name: { type: string, minLength: 1, maxLength: 60 }
      additionalProperties: false

    WorkspaceDomainCreate:
      type: object
      required: [domain, mailboxes, confirm]
      properties:
        domain: { type: string, minLength: 3, maxLength: 253 }
        mailboxes:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/WorkspaceMailboxInput' }
        confirm:
          type: boolean
          description: Must be true; every mailbox is a paid Workspace licence
      additionalProperties: false

    WorkspaceDomainStatus:
      type: string
      description: |
        provisioning — being added, published, verified and given its mailboxes;
        dkim_required — done except DKIM, which needs the key from the Admin console;
        active — DKIM published; failed — needs a person (see error_code), then retry.
      enum: [provisioning, dkim_required, active, failed]

    WorkspaceMailboxStatus:
      type: string
      description: |
        pending — not created yet; created — exists in Workspace with the stored
        password; failed — Google refused it, or the address was someone else's.
      enum: [pending, created, failed]

    WorkspaceMailbox:
      type: object
      required: [id, email, given_name, family_name, position, status, create_attempts, instantly_warmup, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        position: { type: integer, minimum: 0, maximum: 4 }
        status: { $ref: '#/components/schemas/WorkspaceMailboxStatus' }
        create_attempts: { type: integer }
        error_code:
          type: string
          nullable: true
          description: address_taken or mailbox_rejected
        error_message: { type: string, nullable: true }
        provisioned_at: { type: string, format: date-time, nullable: true }
        instantly_status:
          allOf:
            - $ref: '#/components/schemas/WorkspaceInstantlyStatus'
          nullable: true
          description: Null until a connection to Instantly is started
        instantly_account_id: { type: string, nullable: true }
        instantly_error: { type: string, nullable: true, description: Why it failed, or why warmup did not start }
        instantly_session_expires_at: { type: string, format: date-time, nullable: true }
        instantly_connected_at: { type: string, format: date-time, nullable: true }
        instantly_warmup: { type: boolean, description: Warmup was asked for with the connection }
        instantly_warmup_enabled_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    WorkspaceInstantlyStatus:
      type: string
      description: |
        connecting — a sign-in session is open; connected — Instantly has the account;
        failed — Instantly refused it (see instantly_error); expired — nobody signed in
        in time.
      enum: [connecting, connected, failed, expired]

    WorkspaceMailboxesAdd:
      type: object
      required: [mailboxes, confirm]
      properties:
        mailboxes:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/WorkspaceMailboxInput' }
        confirm:
          type: boolean
          description: Must be true; every mailbox is a paid Workspace licence
      additionalProperties: false

    WorkspaceInstantlyConnect:
      type: object
      properties:
        warmup:
          type: boolean
          default: false
          description: Turn Instantly warmup on once the mailbox is connected
      additionalProperties: false

    WorkspaceInstantlyConnection:
      type: object
      required: [auth_url, expires_at, mailbox]
      properties:
        auth_url:
          type: string
          description: Google sign-in to open in a new tab, pre-filled with the mailbox
        expires_at: { type: string, format: date-time }
        mailbox: { $ref: '#/components/schemas/WorkspaceMailbox' }

    WorkspaceDomain:
      type: object
      required: [id, domain_name, status, created_at, updated_at, mailboxes]
      properties:
        id: { type: string, format: uuid }
        domain_name: { type: string }
        status: { $ref: '#/components/schemas/WorkspaceDomainStatus' }
        next_step:
          type: string
          nullable: true
          description: What a person has to do next, when anything
        verification_token:
          type: string
          nullable: true
          description: The google-site-verification TXT value published at the apex
        dkim_selector: { type: string, nullable: true }
        added_at: { type: string, format: date-time, nullable: true, description: Added to Workspace }
        dns_published_at: { type: string, format: date-time, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
        dkim_published_at: { type: string, format: date-time, nullable: true }
        error_code:
          type: string
          nullable: true
          description: |
            not_configured, auth_failed, dns_auth_failed, zone_not_found, dns_conflict,
            dns_rejected, domain_rejected, verification_timed_out, mailbox_rejected,
            aborted
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mailboxes:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMailbox' }

    WorkspaceDomainList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceDomain' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    WorkspaceDkimUpdate:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 5000
          description: The TXT value from the Admin console, "v=DKIM1; k=rsa; p=..."
        selector:
          type: string
          maxLength: 63
          description: The prefix chosen in the Admin console; defaults to `google`
      additionalProperties: false

    WorkspaceMailboxCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    OutreachOutcome:
      type: string
      enum: [successful, potential, bad, replied, no_reply, bounced, not_contacted]

    InboxEmail:
      type: object
      description: One received email, as the inbox lists it.
      required: [id, direction, is_unread, is_auto_reply, sent_at, thread_emails]
      properties:
        id: { type: string, description: Instantly's email id }
        thread_id: { type: string, nullable: true }
        direction: { type: string, enum: [received, sent] }
        email_account: { type: string, nullable: true, description: The mailbox that received it }
        lead_email: { type: string, nullable: true }
        from_address: { type: string, nullable: true }
        to_addresses: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        content_preview: { type: string, nullable: true }
        is_unread: { type: boolean }
        is_auto_reply: { type: boolean }
        interest_status: { type: integer, nullable: true, description: The email's Instantly i_status }
        ai_interest_value: { type: number, format: double, nullable: true }
        instantly_campaign_id: { type: string, nullable: true }
        campaign_id: { type: string, format: uuid, nullable: true }
        campaign_name: { type: string, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        company: { type: string, nullable: true }
        campaign_lead_id: { type: string, format: uuid, nullable: true }
        lead_interest_label:
          type: string
          nullable: true
          description: The lead's current interest status, which can be newer than the email's
        lead_outcome:
          allOf: [{ $ref: '#/components/schemas/OutreachOutcome' }]
          nullable: true
        sent_at: { type: string, format: date-time }
        thread_emails: { type: integer, format: int64, description: Emails stored for this thread }

    InboxEmailList:
      type: object
      required: [data, meta, unread_total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InboxEmail' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        unread_total: { type: integer, format: int64 }

    InboxMessage:
      type: object
      description: One email of a thread, with its body.
      required: [id, direction, is_unread, is_auto_reply, sent_at]
      properties:
        id: { type: string }
        thread_id: { type: string, nullable: true }
        message_id: { type: string, nullable: true }
        direction: { type: string, enum: [received, sent] }
        email_account: { type: string, nullable: true }
        lead_email: { type: string, nullable: true }
        from_address: { type: string, nullable: true }
        to_addresses: { type: string, nullable: true }
        cc_addresses: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        body_text: { type: string, nullable: true }
        body_html: { type: string, nullable: true }
        content_preview: { type: string, nullable: true }
        step: { type: string, nullable: true }
        is_unread: { type: boolean }
        is_auto_reply: { type: boolean }
        interest_status: { type: integer, nullable: true }
        campaign_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        sent_at: { type: string, format: date-time }

    InboxThread:
      type: object
      required: [thread_id, stale, emails]
      properties:
        thread_id: { type: string }
        stale:
          type: boolean
          description: Instantly could not be asked for the full thread; only stored emails are shown
        emails:
          type: array
          items: { $ref: '#/components/schemas/InboxMessage' }

    OutreachLead:
      type: object
      description: One campaign lead and how outreach to them went.
      required: [lead_id, campaign_id, campaign_name, contact_id, email, status, outcome, emails_sent,
                 open_count, click_count, reply_count]
      properties:
        lead_id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        campaign_name: { type: string }
        contact_id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        company: { type: string, nullable: true }
        title: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CampaignLeadStatus' }
        interest_status: { type: integer, nullable: true }
        interest_label:
          type: string
          nullable: true
          description: Instantly's lead status, e.g. interested, meeting_booked, not_interested
        outcome: { $ref: '#/components/schemas/OutreachOutcome' }
        sending_account: { type: string, nullable: true, description: The mailbox that last emailed them }
        emails_sent: { type: integer, format: int64 }
        first_contacted_at: { type: string, format: date-time, nullable: true }
        last_contacted_at: { type: string, format: date-time, nullable: true }
        open_count: { type: integer }
        click_count: { type: integer }
        reply_count: { type: integer }
        last_replied_at: { type: string, format: date-time, nullable: true }
        last_reply_subject: { type: string, nullable: true }
        last_reply_preview: { type: string, nullable: true }
        last_reply_thread_id: { type: string, nullable: true }

    OutreachOutcomeCounts:
      type: object
      description: Leads per outcome under the same filter, ignoring the outcome filter itself.
      required: [successful, potential, bad, replied, no_reply, bounced, not_contacted]
      properties:
        successful: { type: integer, format: int64 }
        potential: { type: integer, format: int64 }
        bad: { type: integer, format: int64 }
        replied: { type: integer, format: int64 }
        no_reply: { type: integer, format: int64 }
        bounced: { type: integer, format: int64 }
        not_contacted: { type: integer, format: int64 }

    OutreachLeadList:
      type: object
      required: [data, meta, outcomes]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OutreachLead' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        outcomes: { $ref: '#/components/schemas/OutreachOutcomeCounts' }
